<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; base-uri 'self'; object-src 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="refresh" content="0; url=oeuvre-actuelle.html">
<link rel="canonical" href="https://w2bphotography.com/oeuvre-actuelle.html">
<meta name="robots" content="noindex">
<title>W2b</title>
<script>
/* home.html retired 2026-11-11 — split into oeuvre-actuelle.html (current
   work: Bailar la Ciudad / Lo que dejamos) and autres-travaux.html (every
   other remaining trunk photo). Kept as a redirect stub, same pattern as
   the old gallery-*.html stubs, so bookmarks/old links don't 404 — a
   ?branch=<id> deep link is routed to whichever page actually has that
   branch, with the rest of the URL (hash, other query) carried along. */
(function(){
  var BRANCH_TO_PAGE = {
    'bailar-la-ciudad': 'oeuvre-actuelle.html',
    'contemplations': 'autres-travaux.html'
  };
  var branch;
  try { branch = new URLSearchParams(location.search).get('branch'); } catch(e) { branch = null; }
  var target = (branch && BRANCH_TO_PAGE[branch]) || 'oeuvre-actuelle.html';
  location.replace(target + location.search + location.hash);
})();
</script>
</head>
<body>
  <p>Redirecting to <a href="oeuvre-actuelle.html">W2b</a>…</p>
<script src="js/legal-footer.js" defer></script>
</body>
</html>
