    <p class="intro" data-k="a_intro"></p>

    </div>
    <p class="reassure" data-k="b_reassure"></p>

      <div class="field"><label for="c-org" data-k="c_f_org"></label><input id="c-org" name="organisation" type="text"></div>
      <div class="field"><label for="c-type" data-k="c_f_type"></label>
        <select id="c-type" name="type"><option data-k="opt_press"></option><option data-k="opt_expo"></option><option data-k="opt_pub"></option><option data-k="opt_other"></option></select></div>
      <div class="field"><label for="c-msg" data-k="c_f_msg"></label><textarea id="c-msg" name="message" rows="4" required></textarea></div>
      <div class="field"><label for="c-email" data-k="f_email"></label><input id="c-email" name="email" type="email" required></div>
      <button class="submit" type="submit" data-k="c_submit"></button>
    </form>
