<script src="js/gallery-data.js?v=9"></script>
<script src="js/art-i18n.js?v=8"></script>
<script>
(function(){
  if(typeof w2bApplyUI==='function') w2bApplyUI();
  var L=(window.W2B_LANG)||'fr';

  var S={
    fr:{k:"Tirages",h1:"Acquérir un tirage",intro:"Une sélection d'images, en tirages d'art : encre pigmentaire sur coton. Les éditions collector sont numérotées, avec certificat signé ; les éditions ouvertes sont des tirages d'archive, sans certificat.",terms:"Chaque tirage est fait sur commande et expédié dans le monde entier. Comptez deux à trois semaines. Prix en euros ; peso colombien sur demande.",dark:"Les tirages de la section After Dark sont disponibles en privé, sur demande.",darklink:"Écrire",coll:"Édition collector",open:"Édition ouverte",from:"dès",size:"Format",name:"Nom",email:"Email",note:"Un mot (facultatif)",submit:"Demander ce tirage",ok:"Merci. Je confirme la disponibilité et t'envoie la facture sous quelques jours.",noteCol:"Numéroté · édition limitée de 15 + 2 AP · avec certificat d'authenticité signé.",noteOpen:"Édition ouverte · tirage pigmentaire d'archive · non signé.",consent:"J'accepte que mes données soient traitées pour répondre à ma demande, selon la",privacylink:"Politique de confidentialité."},
    en:{k:"Prints",h1:"Collect a print",intro:"A selection of images, as fine-art prints: pigment ink on cotton rag. Collector editions are numbered, with a signed certificate; open editions are archival prints, without a certificate.",terms:"Each print is made to order and shipped worldwide. Allow two to three weeks. Prices in euros; Colombian peso on request.",dark:"Prints from the After Dark section are available privately, on request.",darklink:"Write",coll:"Collector edition",open:"Open edition",from:"from",size:"Size",name:"Name",email:"Email",note:"A note (optional)",submit:"Request this print",ok:"Thank you. I'll confirm availability and send the invoice within a few days.",noteCol:"Numbered · limited edition of 15 + 2 AP · with a signed certificate of authenticity.",noteOpen:"Open edition · archival pigment print · unsigned.",consent:"I agree my data may be processed to answer my request, per the",privacylink:"Privacy policy."},
    es:{k:"Copias",h1:"Adquirir una copia",intro:"Una selección de imágenes, en copias de autor: tinta pigmentada sobre algodón. Las ediciones coleccionista están numeradas, con certificado firmado; las ediciones abiertas son copias de archivo, sin certificado.",terms:"Cada copia se hace por encargo y se envía a todo el mundo. Dos a tres semanas. Precios en euros; peso colombiano a pedido.",dark:"Las copias de la sección After Dark están disponibles en privado, a pedido.",darklink:"Escribir",coll:"Edición coleccionista",open:"Edición abierta",from:"desde",size:"Formato",name:"Nombre",email:"Email",note:"Una nota (opcional)",submit:"Solicitar esta copia",ok:"Gracias. Confirmo disponibilidad y te envío la factura en unos días.",noteCol:"Numerada · edición limitada de 15 + 2 AP · con certificado de autenticidad firmado.",noteOpen:"Edición abierta · copia pigmentada de archivo · sin firmar.",consent:"Acepto que mis datos se traten para responder a mi solicitud, según la",privacylink:"Política de datos."}
  };
  var D=S[L]||S.fr;
  document.getElementById('s_k').textContent=D.k;
  document.getElementById('s_h1').textContent=D.h1;
  document.getElementById('s_intro').textContent=D.intro;
  document.getElementById('s_terms').textContent=D.terms;
  document.getElementById('s_dark').textContent=D.dark;
  document.getElementById('s_dark_link').textContent=D.darklink;

  var TIERS={
    collector:{subject:"Print order (collector) — w2b art",sizes:[{label:"30 × 40 cm",eur:150},{label:"50 × 70 cm",eur:290},{label:"70 × 100 cm",eur:520}]},
    open:{subject:"Print order (open) — w2b art",sizes:[{label:"30 × 40 cm",eur:75},{label:"50 × 70 cm",eur:145},{label:"70 × 100 cm",eur:260}]}
  };
  /* Shop sources the assorted trunk (open edition) + the three named
     projects with a real branch (collector edition) — see trunk-data.js.
     Tier is by gallery, not by individual photo: a defensible default
     (named project = numbered edition, broader trunk = archival open
     edition), easy to flip per-photo later if a different split is
     wanted. */
  var COLLECTOR_GALLERIES=["branch-bailar-la-ciudad","branch-lo-que-dejamos","branch-pretty-od"];
  var isCollector=function(galleryId){return COLLECTOR_GALLERIES.indexOf(galleryId)!==-1;};
  /* Exhibition/fanzine documentation shots inside the branch galleries —
     real photos of a print on a wall or a fanzine stack, not themselves
     sellable prints. Excluded from the shop only. */
  var SHOP_EXCLUDE={
    "branch-bailar-la-ciudad":["palacio-bellas-artes-facade-installation-print-w2b.jpg","bailar-la-ciudad-exhibition-panel-detail-w2b.jpg","cypher-miraflores-fanzine-stack-wood-table-w2b.jpg"],
    "branch-lo-que-dejamos":["lo-que-dejamos-exhibition-wide-parque-luces-w2b.jpg","lo-que-dejamos-exhibition-panel-angle-w2b.jpg","lo-que-dejamos-exhibition-panel-closeup-w2b.jpg"]
  };
  var TITLES={
   "weathered-rock-formation-coastal-texture-w2b.jpg":{en:"Weathering",fr:"Érosion",es:"Erosión"},
   "driftwood-pebble-beach-mountains-black-white-w2b.jpg":{en:"Driftwood",fr:"Bois flotté",es:"Madera a la deriva"},
   "sunset-pine-trees-mountain-silhouette-w2b.jpg":{en:"Dusk Pines",fr:"Sapins du soir",es:"Pinos del atardecer"},
   "contemplations-wrecked-boat-rocky-shore-black-white-w2b.jpg":{en:"Wreckage",fr:"Épave",es:"Naufragio"},
   "glass-roof-grid-baroque-sculpture-ornament-w2b.jpg":{en:"Under Glass",fr:"Sous verre",es:"Bajo cristal"},
   "pinball-arcade-machine-jackpot-cards-neon-w2b.jpg":{en:"Jackpot",fr:"Jackpot",es:"Jackpot"},
   "red-lamp-crossed-legs-magazine-intimate-room-w2b.jpg":{en:"Red Light",fr:"Lumière rouge",es:"Luz roja"},
   "street-dancer-colombia-jersey-motion-night-w2b.jpg":{en:"Mid-Step",fr:"En plein pas",es:"En pleno paso"},
   "rowboats-misty-lake-mountains-w2b.jpg":{en:"Moored",fr:"À quai",es:"Amarrados"},
   "bamboo-tunnel-pond-stone-wall-w2b.jpg":{en:"Bamboo Passage",fr:"Passage de bambous",es:"Paso de bambú"},
   "coastal-path-bench-ocean-view-faded-film-w2b.jpg":{en:"The Bench",fr:"Le banc",es:"El banco"},
   "rushing-water-rocks-black-white-w2b.jpg":{en:"White Water",fr:"Eau vive",es:"Agua viva"},
   "hands-playing-double-bass-black-white-w2b.jpg":{en:"Bowed",fr:"À l'archet",es:"Con el arco"},
   "street-lamp-silhouette-bird-sky-black-white-w2b.jpg":{en:"Flight",fr:"Envol",es:"Vuelo"},
   "wet-tree-bark-dripping-water-close-up-w2b.jpg":{en:"After Rain",fr:"Après la pluie",es:"Después de la lluvia"},
   "abandoned-train-wagons-junkyard-color-w2b.jpg":{en:"What's Left",fr:"Ce qui reste",es:"Lo que queda"},
   "woman-car-window-candid-street-black-white-w2b.jpg":{en:"Glimpsed",fr:"Entrevue",es:"Vislumbre"},
   "dark-bay-coastline-silhouette-dramatic-sky-black-white-w2b.jpg":{en:"Dark Bay",fr:"Baie sombre",es:"Bahía oscura"},
   "bolts-nuts-industrial-gear-close-up-black-white-w2b.jpg":{en:"Gearwork",fr:"Rouages",es:"Engranaje"},
   "crowded-historic-passage-street-photography-black-white-w2b.jpg":{en:"Passage",fr:"Passage",es:"Pasaje"},
   "man-trucker-cap-sunglasses-night-portrait-black-white-w2b.jpg":{en:"Trucker Cap",fr:"Casquette",es:"Gorra"},
   "men-streetwear-cap-flip-night-black-white-w2b.jpg":{en:"Cap Flip",fr:"Casquette en l'air",es:"Gorra al aire"},
   "man-glasses-hand-gesture-tattoos-portrait-black-white-w2b.jpg":{en:"Unbothered",fr:"Sans détour",es:"Sin rodeos"},
   "breakdancer-mid-motion-red-light-w2b.jpg":{en:"Freeze",fr:"Freeze",es:"Freeze"},
   "scrap-metal-yard-entrance-barbed-wire-workers-w2b.jpg":{en:"Scrapyard",fr:"Casse",es:"Chatarrería"},
   "abandoned-factory-water-tower-overgrown-w2b.jpg":{en:"Water Tower",fr:"Château d'eau",es:"Torre de agua"},
   "ruined-building-interior-debris-furniture-w2b.jpg":{en:"Interior",fr:"Intérieur",es:"Interior"},
   "calle-54-street-sign-rubble-w2b.jpg":{en:"Calle 54",fr:"Calle 54",es:"Calle 54"},
   "pink-plastic-wrap-figure-abstract-w2b.jpg":{en:"Wrapped",fr:"Enveloppé",es:"Envuelta"},
   "red-light-glowing-eyes-intense-portrait-w2b.jpg":{en:"Red Eyes",fr:"Yeux rouges",es:"Ojos rojos"},
   "woman-reclining-neon-light-bedroom-w2b.jpg":{en:"Neon Bedroom",fr:"Chambre néon",es:"Cuarto neón"},
   "woman-graphic-tee-pink-lit-room-posters-w2b.jpg":{en:"Pink Room",fr:"Chambre rose",es:"Cuarto rosa"},
   "pink-love-perfume-bottle-still-life-w2b.jpg":{en:"Pink Love",fr:"Pink Love",es:"Pink Love"}
  };
  var titleFor=function(file,fallback){var t=TITLES[file];return (t&&(t[L]||t.en))||(fallback?fallback.split(',')[0]:file);};

  var SHOP_GALLERIES=["trunk","branch-bailar-la-ciudad","branch-lo-que-dejamos","branch-pretty-od"];
  /* These 3 trunk photos are each a project's own anchor/hero image on
     home.html (the trunk photo that opens that project's branch — see
     trunk-data.js t07/t08/t16) — they belong to the project, not to the
     assorted "Selección" grab-bag, even though the file itself lives in
     images/trunk/. Pulled out of trunk and placed first in their real
     project's group, same Collector tier as the rest of that project. */
  var ANCHOR_TO_PROJECT={
    "red-lamp-crossed-legs-magazine-intimate-room-w2b.jpg":"branch-pretty-od",
    "street-dancer-colombia-jersey-motion-night-w2b.jpg":"branch-bailar-la-ciudad",
    "abandoned-train-wagons-junkyard-color-w2b.jpg":"branch-lo-que-dejamos"
  };
  var groupsEl=document.getElementById('shop-groups');
  var seen={}; /* dedupe across galleries */

  SHOP_GALLERIES.forEach(function(id){
    var g=GALLERY_DATA[id]; if(!g) return;
    var excl=SHOP_EXCLUDE[id]||[];
    var imgs=g.images
      .filter(function(im){ return id==='trunk' ? !ANCHOR_TO_PROJECT[im.file] : true; })
      .map(function(im){ return {file:im.file, alt:im.alt, folder:g.folder}; });
    /* inject this project's reassigned trunk anchor(s), lead position */
    if(id!=='trunk' && GALLERY_DATA.trunk){
      var anchors=GALLERY_DATA.trunk.images.filter(function(im){ return ANCHOR_TO_PROJECT[im.file]===id; })
        .map(function(im){ return {file:im.file, alt:im.alt, folder:GALLERY_DATA.trunk.folder}; });
      imgs=anchors.concat(imgs);
    }
    imgs=imgs.filter(function(im){ if(seen[im.file]) return false; if(excl.indexOf(im.file)!==-1) return false; seen[im.file]=1; return true; });
    if(!imgs.length) return;
    var sec=document.createElement('section'); sec.className='shop-group';
    var ttl=document.createElement('div'); ttl.className='shop-group-title';
    ttl.innerHTML='<h2>'+(g.title[L]||g.title.fr)+'</h2><span class="ln"></span>';
    sec.appendChild(ttl);
    var grid=document.createElement('div'); grid.className='shop-grid';
    imgs.forEach(function(im){
      var col=isCollector(id), tier=col?'collector':'open';
      var minEur=TIERS[tier].sizes[0].eur;
      var t=titleFor(im.file, im.alt&&(im.alt[L]||im.alt.fr));
      var card=document.createElement('div'); card.className='print';
      card.innerHTML='<div class="frame"><img loading="lazy" src="'+im.folder+im.file+'" alt="'+((im.alt&&(im.alt[L]||im.alt.fr))||'').replace(/"/g,'')+'"></div>'+
        '<div class="edition">'+(col?D.coll:D.open)+'</div>'+
        '<div class="meta"><span class="t">'+t+'</span><span class="from">'+D.from+' '+minEur+' €</span></div>'+
        '<button class="buy">'+D.submit+'</button>';
      card.querySelector('.buy').addEventListener('click',function(){ openAcq(im.file,tier,t); });
      grid.appendChild(card);
    });
    sec.appendChild(grid); groupsEl.appendChild(sec);
  });

  /* acquire modal */
  var acq=document.getElementById('acq'),form=document.getElementById('acq-form');
  document.getElementById('acq-k').textContent=D.k;
  document.getElementById('acq-l-size').textContent=D.size;
  document.getElementById('acq-l-name').textContent=D.name;
  document.getElementById('acq-l-email').textContent=D.email;
  document.getElementById('acq-l-note').textContent=D.note;
  document.getElementById('acq-submit').textContent=D.submit;
  document.getElementById('acq-l-consent').textContent=D.consent;
  document.getElementById('acq-l-privacy').textContent=D.privacylink;
  function openAcq(file,tier,title){
    document.getElementById('acq-title').textContent=title;
    document.getElementById('acq-ed').textContent=(tier==='collector')?D.noteCol:D.noteOpen;
    document.getElementById('acq-print').value=title+' ('+file+')';
    document.getElementById('acq-editionf').value=tier;
    document.getElementById('acq-subject').value=TIERS[tier].subject;
    var sel=document.getElementById('acq-size'); sel.innerHTML='';
    TIERS[tier].sizes.forEach(function(s){ var o=document.createElement('option'); o.value=s.label+' — '+s.eur+' €'; o.textContent=s.label+' — '+s.eur+' €'; sel.appendChild(o); });
    document.getElementById('acq-ok').style.display='none';
    acq.classList.add('open'); document.body.style.overflow='hidden';
  }
  function closeAcq(){ acq.classList.remove('open'); document.body.style.overflow=''; }
  (function(){var x=document.getElementById('acq-x');var lbl={fr:'Fermer',en:'Close',es:'Cerrar'}[L]||'Fermer';x.setAttribute('aria-label',lbl);x.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();closeAcq();}});})();
  document.getElementById('acq-x').addEventListener('click',closeAcq);
  acq.addEventListener('click',function(e){ if(e.target===acq) closeAcq(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeAcq(); });
  form.addEventListener('submit',function(e){
    e.preventDefault();
    fetch(form.action,{method:'POST',body:new FormData(form),headers:{'Accept':'application/json'}})
      .then(function(r){ if(r.ok){ var ok=document.getElementById('acq-ok'); ok.textContent=D.ok; ok.style.display='block'; form.querySelector('.submit').style.display='none'; } });
  });
})();
</script>
