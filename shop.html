<script>
(function(){
  if(typeof w2bApplyUI==='function') w2bApplyUI();
  var L=(window.W2B_LANG)||'fr';

  var S={
    fr:{k:"Tirages",h1:"Acquérir un tirage",intro:"Une sélection d'images, en tirages d'art : encre pigmentaire sur coton. Les éditions collector sont numérotées, avec certificat signé ; les éditions ouvertes sont des tirages d'archive, sans certificat.",terms:"Chaque tirage est fait sur commande et expédié dans le monde entier. Comptez deux à trois semaines. Prix en euros ; peso colombien sur demande.",dark:"Les tirages de la section After Dark sont disponibles en privé, sur demande.",darklink:"Écrire",coll:"Édition collector",open:"Édition ouverte",from:"dès",size:"Format",name:"Nom",email:"Email",note:"Un mot (facultatif)",submit:"Demander ce tirage",ok:"Merci. Je confirme la disponibilité et t'envoie la facture sous quelques jours.",noteCol:"Numéroté · édition limitée de 15 + 2 AP · avec certificat d'authenticité signé.",noteOpen:"Édition ouverte · tirage pigmentaire d'archive · non signé.",consent:"J'accepte que mes données soient traitées pour répondre à ma demande, selon la",privacylink:"Politique de confidentialité.",series_h:"Séries",selection_h:"Sélection",go:"Voir la série",back:"← Tirages"},
    en:{k:"Prints",h1:"Collect a print",intro:"A selection of images, as fine-art prints: pigment ink on cotton rag. Collector editions are numbered, with a signed certificate; open editions are archival prints, without a certificate.",terms:"Each print is made to order and shipped worldwide. Allow two to three weeks. Prices in euros; Colombian peso on request.",dark:"Prints from the After Dark section are available privately, on request.",darklink:"Write",coll:"Collector edition",open:"Open edition",from:"from",size:"Size",name:"Name",email:"Email",note:"A note (optional)",submit:"Request this print",ok:"Thank you. I'll confirm availability and send the invoice within a few days.",noteCol:"Numbered · limited edition of 15 + 2 AP · with a signed certificate of authenticity.",noteOpen:"Open edition · archival pigment print · unsigned.",consent:"I agree my data may be processed to answer my request, per the",privacylink:"Privacy policy.",series_h:"Series",selection_h:"Selection",go:"See the series",back:"← Prints"},
    es:{k:"Copias",h1:"Adquirir una copia",intro:"Una selección de imágenes, en copias de autor: tinta pigmentada sobre algodón. Las ediciones coleccionista están numeradas, con certificado firmado; las ediciones abiertas son copias de archivo, sin certificado.",terms:"Cada copia se hace por encargo y se envía a todo el mundo. Dos a tres semanas. Precios en euros; peso colombiano a pedido.",dark:"Las copias de la sección After Dark están disponibles en privado, a pedido.",darklink:"Escribir",coll:"Edición coleccionista",open:"Edición abierta",from:"desde",size:"Formato",name:"Nombre",email:"Email",note:"Una nota (opcional)",submit:"Solicitar esta copia",ok:"Gracias. Confirmo disponibilidad y te envío la factura en unos días.",noteCol:"Numerada · edición limitada de 15 + 2 AP · con certificado de autenticidad firmado.",noteOpen:"Edición abierta · copia pigmentada de archivo · sin firmar.",consent:"Acepto que mis datos se traten para responder a mi solicitud, según la",privacylink:"Política de datos.",series_h:"Series",selection_h:"Selección",go:"Ver la serie",back:"← Copias"}
  };
  var D=S[L]||S.fr;
  document.getElementById('s_k').textContent=D.k;
  document.getElementById('s_h1').textContent=D.h1;
  document.getElementById('s_intro').textContent=D.intro;
  document.getElementById('s_terms').textContent=D.terms;
  document.getElementById('s_dark').textContent=D.dark;
  document.getElementById('s_dark_link').textContent=D.darklink;

  var TIERS={
    collector:{subject:"Print order (collector) — w2b art",sizes:[{label:"30 × 40 cm",eur:150},{label:"50 × 70 cm",eur:290},{label:"70 × 100 cm",eur:520}]},
    open:{subject:"Print order (open) — w2b art",sizes:[{label:"30 × 40 cm",eur:75},{label:"50 × 70 cm",eur:145},{label:"70 × 100 cm",eur:260}]}
  };
  /* Shop sources the assorted trunk (open edition) + the three named
     projects with a real branch (collector edition) — see trunk-data.js.
     Tier is by gallery, not by individual photo: a defensible default
     (named project = numbered edition, broader trunk = archival open
     edition), easy to flip per-photo later if a different split is
     wanted. */
  var COLLECTOR_GALLERIES=["branch-bailar-la-ciudad","branch-lo-que-dejamos"];
  var isCollector=function(galleryId){return COLLECTOR_GALLERIES.indexOf(galleryId)!==-1;};
  /* Exhibition/fanzine documentation shots inside the branch galleries —
     real photos of a print on a wall or a fanzine stack, not themselves
     sellable prints. Excluded from the shop only. */
  var SHOP_EXCLUDE={
    "branch-bailar-la-ciudad":["palacio-bellas-artes-facade-installation-print-w2b.jpg","bailar-la-ciudad-exhibition-panel-detail-w2b.jpg","cypher-miraflores-fanzine-stack-wood-table-w2b.jpg"],
    "branch-lo-que-dejamos":["lo-que-dejamos-exhibition-wide-parque-luces-w2b.jpg","lo-que-dejamos-exhibition-panel-angle-w2b.jpg","lo-que-dejamos-exhibition-panel-closeup-w2b.jpg"]
  };
  var TITLES={
   "weathered-rock-formation-coastal-texture-w2b.jpg":{en:"Weathering",fr:"Érosion",es:"Erosión"},
   "driftwood-pebble-beach-mountains-black-white-w2b.jpg":{en:"Driftwood",fr:"Bois flotté",es:"Madera a la deriva"},
   "contemplations-wrecked-boat-rocky-shore-black-white-w2b.jpg":{en:"Wreckage",fr:"Épave",es:"Naufragio"},
   "glass-roof-grid-baroque-sculpture-ornament-w2b.jpg":{en:"Under Glass",fr:"Sous verre",es:"Bajo cristal"},
   "pinball-arcade-machine-jackpot-cards-neon-w2b.jpg":{en:"Jackpot",fr:"Jackpot",es:"Jackpot"},
   "red-lamp-crossed-legs-magazine-intimate-room-w2b.jpg":{en:"Red Light",fr:"Lumière rouge",es:"Luz roja"},
   "street-dancer-colombia-jersey-motion-night-w2b.jpg":{en:"Mid-Step",fr:"En plein pas",es:"En pleno paso"},
   "bamboo-tunnel-pond-stone-wall-w2b.jpg":{en:"Bamboo Passage",fr:"Passage de bambous",es:"Paso de bambú"},
   "coastal-path-bench-ocean-view-faded-film-w2b.jpg":{en:"The Bench",fr:"Le banc",es:"El banco"},
   "rushing-water-rocks-black-white-w2b.jpg":{en:"White Water",fr:"Eau vive",es:"Agua viva"},
   "hands-playing-double-bass-black-white-w2b.jpg":{en:"Bowed",fr:"À l'archet",es:"Con el arco"},
   "abandoned-train-wagons-junkyard-color-w2b.jpg":{en:"What's Left",fr:"Ce qui reste",es:"Lo que queda"},
   "woman-car-window-candid-street-black-white-w2b.jpg":{en:"Glimpsed",fr:"Entrevue",es:"Vislumbre"},
   "dark-bay-coastline-silhouette-dramatic-sky-black-white-w2b.jpg":{en:"Dark Bay",fr:"Baie sombre",es:"Bahía oscura"},
   "bolts-nuts-industrial-gear-close-up-black-white-w2b.jpg":{en:"Gearwork",fr:"Rouages",es:"Engranaje"},
   "crowded-historic-passage-street-photography-black-white-w2b.jpg":{en:"Passage",fr:"Passage",es:"Pasaje"},
   "man-trucker-cap-sunglasses-night-portrait-black-white-w2b.jpg":{en:"Trucker Cap",fr:"Casquette",es:"Gorra"},
   "men-streetwear-cap-flip-night-black-white-w2b.jpg":{en:"Cap Flip",fr:"Casquette en l'air",es:"Gorra al aire"},
   "man-glasses-hand-gesture-tattoos-portrait-black-white-w2b.jpg":{en:"Unbothered",fr:"Sans détour",es:"Sin rodeos"},
   "breakdancer-mid-motion-red-light-w2b.jpg":{en:"Freeze",fr:"Freeze",es:"Freeze"},
   "scrap-metal-yard-entrance-barbed-wire-workers-w2b.jpg":{en:"Scrapyard",fr:"Casse",es:"Chatarrería"},
   "abandoned-factory-water-tower-overgrown-w2b.jpg":{en:"Water Tower",fr:"Château d'eau",es:"Torre de agua"},
   "ruined-building-interior-debris-furniture-w2b.jpg":{en:"Interior",fr:"Intérieur",es:"Interior"},
   "calle-54-street-sign-rubble-w2b.jpg":{en:"Calle 54",fr:"Calle 54",es:"Calle 54"}
  };
  // 2026-11-15 — the museum-label title Guillaume sets per photo in the
  // admin tool (gallery-data.js's im.title) always wins now: this TITLES
  // map was a one-time hand-typed snapshot that drifted out of sync with
  // whatever he later edited there. Kept as a fallback only for photos
  // that predate the title field and never got one set.
  var titleFor=function(file,imTitle,fallback){if(imTitle)return imTitle[L]||imTitle.en||imTitle.fr;var t=TITLES[file];return (t&&(t[L]||t.en))||(fallback?fallback.split(',')[0]:file);};

  /* 2026-11-15 — rebuilt to source directly from trunk-data.js's real
     anchor/branch structure instead of this file's own, separately
     maintained SHOP_GALLERIES/ANCHOR_TO_PROJECT lists — those had drifted
     badly out of sync (only knew about 2 of the 11 branches actually live
     on oeuvre-actuelle.html/autres-travaux.html, so 9 real projects had no
     way to be bought at all). Now: every trunk anchor with a branch becomes
     a "see the full series" tile, exactly like the trunk/branch pattern on
     the home pages; a branch-less anchor stays a direct, individually
     buyable print — same two-tier split the site already uses, just always
     in sync with whatever trunk-data.js actually says. */
  function resolveShopImg(series,file){
    var g=GALLERY_DATA[series];
    var im=g&&g.images.filter(function(i){return i.file===file;})[0];
    if(!g||!im||im.archived) return null;
    return {file:file,alt:im.alt,title:im.title,folder:g.folder};
  }
  function buyCard(im,tier){
    var minEur=TIERS[tier].sizes[0].eur;
    var t=titleFor(im.file, im.title, im.alt&&(im.alt[L]||im.alt.fr));
    var card=document.createElement('div'); card.className='print';
    card.innerHTML='<div class="frame"><img loading="lazy" src="'+im.folder+im.file+'" alt="'+((im.alt&&(im.alt[L]||im.alt.fr))||'').replace(/"/g,'')+'"></div>'+
      '<div class="edition">'+(tier==='collector'?D.coll:D.open)+'</div>'+
      '<div class="meta"><span class="t">'+t+'</span><span class="from">'+D.from+' '+minEur+' €</span></div>'+
      '<button class="buy">'+D.submit+'</button>';
    card.querySelector('.buy').addEventListener('click',function(){ openAcq(im.file,tier,t); });
    return card;
  }

  var ALL_ANCHORS=(typeof TRUNK_MANIFEST_CURRENT!=='undefined'?TRUNK_MANIFEST_CURRENT:[]).concat(typeof TRUNK_MANIFEST_OTHER!=='undefined'?TRUNK_MANIFEST_OTHER:[]);
  var seriesList=[],standalone=[],seenIds={};
  ALL_ANCHORS.forEach(function(e){
    if(seenIds[e.id]) return; seenIds[e.id]=1; /* t3/t7 currently share one file — guard against showing the same anchor twice if trunk-data.js ever lists an id more than once */
    var anchorIm=resolveShopImg(e.series,e.file);
    if(!anchorIm) return;
    var related=(e.related||[]).filter(function(r){
      var excl=SHOP_EXCLUDE[r.series]||[];
      return excl.indexOf(r.file)===-1;
    });
    if(!related.length){ standalone.push({im:anchorIm,tier:isCollector(e.series)?'collector':'open'}); return; }
    var branchSeries=related[0].series;
    var items=[anchorIm].concat(related.map(function(r){return resolveShopImg(r.series,r.file);}).filter(Boolean));
    var branchG=GALLERY_DATA[branchSeries];
    var title=titleFor(anchorIm.file, anchorIm.title, (branchG&&branchG.title&&(branchG.title[L]||branchG.title.fr))||(anchorIm.alt&&(anchorIm.alt[L]||anchorIm.alt.fr)));
    seriesList.push({cover:anchorIm,title:title,tier:isCollector(branchSeries)?'collector':'open',items:items});
  });

  var groupsEl=document.getElementById('shop-groups');
  var branchOverlay=document.getElementById('shopBranchOverlay'),branchWrap=document.getElementById('shopBranchWrap'),branchBack=document.getElementById('shopBranchBack');
  branchBack.textContent=D.back;
  function openSeries(s){
    branchWrap.innerHTML='';
    s.items.forEach(function(im){ branchWrap.appendChild(buyCard(im,s.tier)); });
    branchOverlay.scrollTop=0;
    branchOverlay.classList.add('open'); branchOverlay.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden'; branchBack.focus();
  }
  function closeSeries(){
    branchOverlay.classList.remove('open'); branchOverlay.setAttribute('aria-hidden','true');
    document.body.style.overflow='';
  }
  branchBack.addEventListener('click',closeSeries);
  branchOverlay.addEventListener('click',function(e){ if(!e.target.closest('.print,.branch-backbar')) closeSeries(); });
  document.addEventListener('keydown',function(e){ if(branchOverlay.classList.contains('open')&&e.key==='Escape') closeSeries(); });

  if(seriesList.length){
    var secS=document.createElement('section'); secS.className='shop-group';
    secS.innerHTML='<div class="shop-group-title"><h2>'+D.series_h+'</h2><span class="ln"></span></div>';
    var gridS=document.createElement('div'); gridS.className='shop-grid';
    seriesList.forEach(function(s){
      var tile=document.createElement('button'); tile.type='button'; tile.className='shop-series-tile';
      tile.innerHTML='<div class="frame"><img loading="lazy" src="'+s.cover.folder+s.cover.file+'" alt="'+((s.cover.alt&&(s.cover.alt[L]||s.cover.alt.fr))||'').replace(/"/g,'')+'"></div>'+
        '<div class="meta"><span class="t">'+s.title+'</span><span class="go">'+D.go+'</span></div>';
      tile.addEventListener('click',function(){ openSeries(s); });
      gridS.appendChild(tile);
    });
    secS.appendChild(gridS); groupsEl.appendChild(secS);
  }
  if(standalone.length){
    var secP=document.createElement('section'); secP.className='shop-group';
    secP.innerHTML='<div class="shop-group-title"><h2>'+D.selection_h+'</h2><span class="ln"></span></div>';
    var gridP=document.createElement('div'); gridP.className='shop-grid';
    standalone.forEach(function(p){ gridP.appendChild(buyCard(p.im,p.tier)); });
    secP.appendChild(gridP); groupsEl.appendChild(secP);
  }

  /* acquire modal */
  var acq=document.getElementById('acq'),form=document.getElementById('acq-form');
  document.getElementById('acq-k').textContent=D.k;
  document.getElementById('acq-l-size').textContent=D.size;
  document.getElementById('acq-l-name').textContent=D.name;
  document.getElementById('acq-l-email').textContent=D.email;
  document.getElementById('acq-l-note').textContent=D.note;
  document.getElementById('acq-submit').textContent=D.submit;
  document.getElementById('acq-l-consent').textContent=D.consent;
  document.getElementById('acq-l-privacy').textContent=D.privacylink;
  function openAcq(file,tier,title){
    document.getElementById('acq-title').textContent=title;
    document.getElementById('acq-ed').textContent=(tier==='collector')?D.noteCol:D.noteOpen;
    document.getElementById('acq-print').value=title+' ('+file+')';
    document.getElementById('acq-editionf').value=tier;
    document.getElementById('acq-subject').value=TIERS[tier].subject;
    var sel=document.getElementById('acq-size'); sel.innerHTML='';
    TIERS[tier].sizes.forEach(function(s){ var o=document.createElement('option'); o.value=s.label+' — '+s.eur+' €'; o.textContent=s.label+' — '+s.eur+' €'; sel.appendChild(o); });
    document.getElementById('acq-ok').style.display='none';
    acq.classList.add('open'); document.body.style.overflow='hidden';
  }
  function closeAcq(){ acq.classList.remove('open'); document.body.style.overflow=''; }
  (function(){var x=document.getElementById('acq-x');var lbl={fr:'Fermer',en:'Close',es:'Cerrar'}[L]||'Fermer';x.setAttribute('aria-label',lbl);x.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();closeAcq();}});})();
  document.getElementById('acq-x').addEventListener('click',closeAcq);
  acq.addEventListener('click',function(e){ if(e.target===acq) closeAcq(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeAcq(); });
  form.addEventListener('submit',function(e){
    e.preventDefault();
    fetch(form.action,{method:'POST',body:new FormData(form),headers:{'Accept':'application/json'}})
      .then(function(r){ if(r.ok){ var ok=document.getElementById('acq-ok'); ok.textContent=D.ok; ok.style.display='block'; form.querySelector('.submit').style.display='none'; } });
  });
})();
</script>
