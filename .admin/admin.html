<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>W2b — local admin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font: 14px/1.4 system-ui, sans-serif; background: #111; color: #eee; margin: 0; }
  header { padding: 10px 20px; background: #1b1b1b; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .note { color: #777; font-size: 11px; }
  nav.tabs { display: flex; gap: 6px; }
  nav.tabs button { background: #222; color: #ccc; border: 1px solid #333; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  nav.tabs button.on { background: #365; color: #fff; border-color: #487; }
  .pub-wrap { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .pub-btn { background: #2a2a2a; color: #ccc; border: 1px solid #3a3a3a; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 7px; }
  .pub-btn.has-pending { background: #4a3410; border-color: #a06b1f; color: #ffd28a; }
  .pub-btn:disabled { opacity: .4; cursor: default; }
  .pub-badge { background: #e0a030; color: #1b1b1b; border-radius: 10px; padding: 0 7px; font-size: 11px; font-weight: 700; min-width: 18px; text-align: center; }
  main { padding: 18px 20px 40px; max-width: 1400px; margin: 0 auto; }
  section.tabpanel { display: none; }
  section.tabpanel.on { display: block; }
  .tab-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .tab-toolbar .hint { color: #777; font-size: 11px; }
  .tab-toolbar .expand-all { background: none; border: 1px solid #333; color: #999; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 11px; }
  .gallery { margin-bottom: 10px; border: 1px solid #2a2a2a; border-radius: 8px; overflow: hidden; }
  .gallery > .g-head { padding: 9px 14px; background: #1b1b1b; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .gallery > .g-head:hover { background: #202020; }
  .gallery > .g-head::before { content: '▸'; color: #666; font-size: 10px; transition: transform .15s; }
  .gallery:not(.collapsed) > .g-head::before { transform: rotate(90deg); }
  .gallery > .g-head b { font-size: 13px; }
  .gallery > .g-head .count { color: #888; font-size: 11px; }
  .gallery > .g-head .archcount { color: #e0a030; }
  .ghead-btn { background: #2a2a2a; color: #ccc; border: 1px solid #3a3a3a; border-radius: 4px; padding: 4px 9px; font-size: 11px; cursor: pointer; }
  .ghead-btn:hover { background: #3a3a3a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 12px; }
  .card { background: #1b1b1b; border: 1px solid #2a2a2a; border-radius: 6px; overflow: hidden; }
  .card.archived { opacity: .45; }
  .card img { width: 100%; height: 100px; object-fit: cover; display: block; background: #000; }
  .card .meta { padding: 6px 8px; }
  .card .fn { font-size: 10px; color: #999; word-break: break-all; display: block; max-height: 2.6em; overflow: hidden; }
  .card .mlabel { font-size: 10px; color: #e0a030; margin-top: 2px; }
  .card .row { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .card button, .card select, .card input { font-size: 10px; padding: 3px 5px; background: #2a2a2a; color: #eee; border: 1px solid #3a3a3a; border-radius: 4px; }
  .card button { cursor: pointer; }
  .card button:hover { background: #3a3a3a; }
  .card button.danger { border-color: #633; }
  .card button.go { border-color: #365; }
  .card input.posnum { width: 36px; }
  .trunk-card { background: #181818; border: 1px solid #272727; border-radius: 8px; padding: 14px; margin: 12px 14px; }
  .tc-head { display: flex; gap: 14px; }
  .tc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .tc-id-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .tc-id { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: .07em; background: #222; padding: 2px 6px; border-radius: 4px; }
  .tc-statement { font-size: 10px; color: #6a8; }
  .tc-title { font-size: 14px; color: #eee; }
  .tc-title.untitled { color: #666; font-style: italic; }
  .tc-fn { font-size: 10px; color: #777; word-break: break-all; }
  .tc-controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .tc-controls .grp { display: flex; flex-direction: column; gap: 3px; }
  .tc-controls .grp label { font-size: 9px; color: #777; text-transform: uppercase; letter-spacing: .05em; }
  .tc-controls .grp-row { display: flex; gap: 5px; }
  .branch-sec { margin-top: 14px; padding-top: 12px; border-top: 1px solid #262626; }
  .branch-sec h4 { margin: 0 0 10px; font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: .07em; }
  .rel-grid { display: flex; flex-wrap: wrap; gap: 14px; }
  .rel-card { width: 112px; }
  .rel-card .rel-fn { display: block; font-size: 9px; color: #999; word-break: break-all; margin: 5px 0 4px; max-height: 2.4em; overflow: hidden; }
  .rel-card .rel-actions { display: flex; flex-wrap: wrap; gap: 3px; }
  .rel-card .rel-actions input.posnum { width: 30px; }
  .trunk-card button, .trunk-card select, .trunk-card input { font-size: 11px; padding: 5px 8px; background: #2a2a2a; color: #eee; border: 1px solid #3a3a3a; border-radius: 4px; }
  .trunk-card button { cursor: pointer; }
  .trunk-card button:hover { background: #3a3a3a; }
  .trunk-card button.danger { border-color: #633; }
  .trunk-card button.go { border-color: #365; }
  .trunk-card input.posnum { width: 44px; padding: 5px 6px; }
  .thumb { width: 112px; height: 112px; object-fit: cover; border-radius: 6px; background: #000; flex-shrink: 0; display: block; }
  .rel-item .thumb { width: 88px; height: 88px; }
  .pick-grid { display: flex; gap: 10px; flex-wrap: wrap; padding: 4px 0; max-width: 100%; }
  .pick-thumb { position: relative; border: 2px solid transparent; border-radius: 7px; padding: 0; background: none; cursor: pointer; line-height: 0; }
  .pick-thumb img { width: 140px; height: 140px; object-fit: cover; border-radius: 5px; display: block; }
  .pick-thumb:hover { border-color: #487; }
  .pick-thumb.sel { border-color: #6c9; }
  .pick-thumb .pt-fn { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; background: rgba(0,0,0,.7); color: #ccc; padding: 3px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 0 0 5px 5px; }
  .toast { position: fixed; bottom: 16px; right: 16px; background: #222; border: 1px solid #444; padding: 10px 16px; border-radius: 6px; max-width: 360px; font-size: 13px; z-index: 50; }
  .toast.err { border-color: #633; color: #f99; }
  .toast.ok { border-color: #365; color: #9f9; }
  .collapsed .grid, .collapsed .trunk-rows { display: none; }
  form.panel { background: #1b1b1b; border: 1px solid #2a2a2a; border-radius: 8px; padding: 16px; margin-bottom: 20px; max-width: 640px; }
  form.panel h3 { margin: 0 0 12px; font-size: 14px; }
  form.panel label { display: block; margin: 10px 0 3px; font-size: 12px; color: #aaa; }
  form.panel input, form.panel select, form.panel textarea { width: 100%; padding: 7px; background: #111; border: 1px solid #333; color: #eee; border-radius: 5px; font-size: 13px; }
  form.panel .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  form.panel button.submit { margin-top: 14px; padding: 9px 18px; background: #365; border: 1px solid #487; color: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; }
  form.panel .hint { font-size: 11px; color: #777; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>W2b art — local admin</h1>
  <span class="note">local only · never deployed</span>
  <nav class="tabs">
    <button data-tab="galleries" class="on">Galleries</button>
    <button data-tab="trunk">Trunk / branches</button>
    <button data-tab="upload">Upload</button>
    <button data-tab="newbranch">New branch</button>
    <button data-tab="darkdesire">Dark Desire</button>
  </nav>
  <div class="pub-wrap">
    <button class="pub-btn" id="pub-btn" type="button" title="Review and push pending changes">
      <span id="pub-label">Publish</span><span class="pub-badge" id="pub-badge" style="display:none">0</span>
    </button>
  </div>
</header>
<main id="main">Loading…</main>
<script>
let STATE = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok || j.ok === false) throw new Error(j.error || 'request failed');
  return j;
}
function toast(msg, isErr) {
  const t = document.createElement('div');
  t.className = 'toast ' + (isErr ? 'err' : 'ok');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), isErr ? 7000 : 3000);
}
async function doAction(action, successMsg) {
  try {
    const r = await api('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(action) });
    STATE = r.state;
    renderAll();
    toast(successMsg || r.message || 'done');
    refreshPublishStatus();
    return r;
  } catch (e) {
    toast(e.message, true);
    throw e;
  }
}

// ---------------------------------------------------------------- Publish (scoped git add+commit+push)
let PENDING_FILES = [];
async function refreshPublishStatus() {
  try {
    const r = await api('/api/git/status');
    PENDING_FILES = r.files;
    const btn = document.getElementById('pub-btn');
    const badge = document.getElementById('pub-badge');
    if (PENDING_FILES.length) {
      btn.classList.add('has-pending');
      badge.style.display = '';
      badge.textContent = PENDING_FILES.length;
    } else {
      btn.classList.remove('has-pending');
      badge.style.display = 'none';
    }
  } catch (e) { /* git not available or not a repo — leave the button inert, non-fatal */ }
}

function openPublishModal() {
  document.querySelectorAll('.modal-backdrop').forEach((n) => n.remove());
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.style = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;';
  const form = document.createElement('form');
  form.className = 'panel';
  form.style = 'margin:0;max-width:560px;max-height:85vh;overflow:auto;';

  const fileRows = PENDING_FILES.length
    ? '<ul style="list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;border:1px solid #2a2a2a;border-radius:6px;">' +
      PENDING_FILES.map((f) => '<li style="padding:5px 10px;font-size:11px;color:#bbb;border-bottom:1px solid #222;display:flex;gap:8px;"><span style="color:#e0a030;width:18px;flex-shrink:0;">' + f.status + '</span><span style="word-break:break-all;">' + f.file + '</span></li>').join('') +
      '</ul>'
    : '<div class="hint">Nothing pending.</div>';

  form.innerHTML = '<h3>Publish changes</h3>' +
    '<div class="hint">Commits and pushes only what this tool itself can touch — images/, gallery-data.js, trunk-data.js, responsive-manifest.js. Nothing else, even if something else in this folder happens to be modified.</div>' +
    '<label>' + PENDING_FILES.length + ' file(s) pending</label>' + fileRows +
    '<label>Commit message (optional)</label><textarea id="pub-msg" rows="2" placeholder="Leave blank for an auto-generated message"></textarea>' +
    '<div style="display:flex;gap:10px;margin-top:14px;">' +
    '<button type="button" class="submit" id="pub-confirm"' + (PENDING_FILES.length ? '' : ' disabled') + '>Commit &amp; push</button>' +
    '<button type="button" id="pub-cancel" style="padding:9px 18px;background:#2a2a2a;border:1px solid #3a3a3a;color:#eee;border-radius:6px;cursor:pointer;">Cancel</button>' +
    '</div>';
  backdrop.appendChild(form);
  document.body.appendChild(backdrop);

  const close = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) close(); };
  document.getElementById('pub-cancel').onclick = close;
  document.getElementById('pub-confirm').onclick = async () => {
    const btn = document.getElementById('pub-confirm');
    btn.disabled = true; btn.textContent = 'Publishing…';
    try {
      const message = document.getElementById('pub-msg').value.trim();
      const r = await api('/api/git/publish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) });
      toast('Pushed ' + r.sha + ' to ' + r.branch + ' (' + r.filesCount + ' file(s))');
      close();
      refreshPublishStatus();
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false; btn.textContent = 'Commit & push';
    }
  };
}
document.getElementById('pub-btn').onclick = openPublishModal;
function galleryIds() { return STATE.galleries.map((g) => g.id); }
// Splits galleries into "live" (trunk, any branch-* actually attached to a
// trunk anchor, and any other gallery with at least one non-archived
// photo) vs. "rest" (fully archived or an orphaned branch) — used to put
// what you'd actually want to upload into first, in the Upload tab's
// target-gallery picker. trunk first, then attached branches in the
// order they appear on the two trunk pages, then other live galleries
// alphabetically.
function liveGalleryTiers() {
  const attachedBranches = [];
  [...STATE.trunk.current, ...STATE.trunk.other].forEach((e) => {
    (e.related || []).forEach((r) => { if (!attachedBranches.includes(r.series)) attachedBranches.push(r.series); });
  });
  const live = [];
  if (STATE.galleries.some((g) => g.id === 'trunk')) live.push('trunk');
  attachedBranches.forEach((id) => { if (STATE.galleries.some((g) => g.id === id)) live.push(id); });
  const otherLive = STATE.galleries
    .filter((g) => g.id !== 'trunk' && !attachedBranches.includes(g.id) && g.images.some((i) => !i.archived))
    .map((g) => g.id)
    .sort();
  live.push(...otherLive);
  const rest = STATE.galleries.map((g) => g.id).filter((id) => !live.includes(id)).sort();
  return { live, rest };
}
function imgUrl(gallery, im) {
  const dir = im.archived ? '_archive/' + gallery.id : gallery.folder.replace(/^images\//, '').replace(/\/$/, '');
  return '/img/' + encodeURIComponent(dir) + '/' + encodeURIComponent(im.file);
}
// Same folder logic as imgUrl, but via /thumb/ (server prefers an existing
// -800w derivative, never generates one) — used anywhere in the Trunk/
// branches tab that shows or picks a photo, so it never pulls full-size
// originals just to render a filename list.
function thumbUrl(gallery, im) {
  const dir = im.archived ? '_archive/' + gallery.id : gallery.folder.replace(/^images\//, '').replace(/\/$/, '');
  return '/thumb/' + encodeURIComponent(dir) + '/' + encodeURIComponent(im.file);
}
function findGalleryAndImage(seriesId, file) {
  const g = STATE.galleries.find((x) => x.id === seriesId);
  const im = g && g.images.find((i) => i.file === file);
  return { g, im };
}
function thumbImg(seriesId, file) {
  const img = document.createElement('img');
  img.className = 'thumb';
  img.loading = 'lazy';
  const { g, im } = findGalleryAndImage(seriesId, file);
  img.src = (g && im) ? thumbUrl(g, im) : '';
  img.alt = '';
  return img;
}

// ---------------------------------------------------------------- Title auto-translate (museum-label title only)
async function translateViaApi(text, from, targets) {
  const r = await fetch('/api/translate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, from, targets }) });
  const j = await r.json();
  if (!r.ok || j.ok === false) throw new Error(j.error || 'translate failed');
  return j.translations;
}
// fields = {en: <input>, fr: <input>, es: <input>}. Fills a language's
// field on blur of whichever field he just typed in, but only into
// fields he hasn't hand-edited himself this session (or that are still
// empty) — never overwrites a field he already corrected. Nothing is
// saved anywhere by this; it only sets .value on the form inputs.
function wireAutoTranslate(fields) {
  const dirty = { en: false, fr: false, es: false };
  let autoFilling = false;
  Object.keys(fields).forEach((lang) => {
    const el = fields[lang];
    if (!el) return;
    el.addEventListener('input', () => { if (!autoFilling) dirty[lang] = true; });
    el.addEventListener('blur', async () => {
      const text = el.value.trim();
      if (!text) return;
      const targets = Object.keys(fields).filter((l) => l !== lang && fields[l] && !dirty[l]);
      if (!targets.length) return;
      try {
        const translations = await translateViaApi(text, lang, targets);
        autoFilling = true;
        targets.forEach((l) => { if (translations[l] != null) fields[l].value = translations[l]; });
        autoFilling = false;
      } catch (e) {
        toast('Auto-translate failed (type the other languages by hand): ' + e.message, true);
      }
    });
  });
}

// ---------------------------------------------------------------- Galleries tab
function metaLabel(im) {
  if (im.title) return (im.title.fr || im.title.en) + (im.year ? ' · ' + im.year : '');
  return '';
}
function card(gallery, im) {
  const div = document.createElement('div');
  div.className = 'card' + (im.archived ? ' archived' : '');
  const img = document.createElement('img');
  img.loading = 'lazy';
  img.src = imgUrl(gallery, im);
  div.appendChild(img);
  const meta = document.createElement('div'); meta.className = 'meta';
  const fn = document.createElement('span'); fn.className = 'fn'; fn.textContent = im.file;
  meta.appendChild(fn);
  const ml = metaLabel(im);
  if (ml) { const m = document.createElement('div'); m.className = 'mlabel'; m.textContent = ml; meta.appendChild(m); }
  const row = document.createElement('div'); row.className = 'row';

  if (im.archived) {
    const btn = document.createElement('button'); btn.className = 'go'; btn.textContent = 'Restore';
    btn.onclick = () => doAction({ type: 'unarchive', gallery: gallery.id, file: im.file }, 'Restored ' + im.file);
    row.appendChild(btn);
  } else {
    const btn = document.createElement('button'); btn.className = 'danger'; btn.textContent = 'Archive';
    btn.onclick = () => doAction({ type: 'archive', gallery: gallery.id, file: im.file }, 'Archived ' + im.file);
    row.appendChild(btn);

    const sel = document.createElement('select');
    const opt0 = document.createElement('option'); opt0.textContent = 'Move to…'; opt0.value = '';
    sel.appendChild(opt0);
    galleryIds().forEach((id) => {
      if (id === gallery.id) return;
      const o = document.createElement('option'); o.value = id; o.textContent = id;
      sel.appendChild(o);
    });
    const posInput = document.createElement('input'); posInput.className = 'posnum'; posInput.placeholder = '#'; posInput.title = 'position (blank = end)';
    sel.onchange = () => {
      if (!sel.value) return;
      const to = sel.value;
      const pos = posInput.value.trim() === '' ? undefined : Number(posInput.value);
      doAction({ type: 'place', from: gallery.id, to, file: im.file, position: pos }, 'Moved ' + im.file + ' → ' + to);
      sel.value = '';
    };
    row.appendChild(sel); row.appendChild(posInput);

    const editBtn = document.createElement('button'); editBtn.textContent = 'Edit label…';
    editBtn.onclick = () => openMetaEditor(gallery, im);
    row.appendChild(editBtn);
  }
  meta.appendChild(row);
  div.appendChild(meta);
  return div;
}

function openMetaEditor(gallery, im) {
  const t = im.title || { en: '', fr: '', es: '' };
  const m = im.medium || { en: '', fr: '', es: '' };
  document.querySelectorAll('.modal-backdrop').forEach((n) => n.remove());
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.style = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;';
  const form = document.createElement('form');
  form.className = 'panel';
  form.style = 'margin:0;max-height:90vh;overflow:auto;';
  form.innerHTML = '<h3>Edit label — ' + im.file + '</h3>' +
    '<label>Title (auto-translates the other two languages on blur — edit any field afterward to stop it being overwritten) — EN / FR / ES</label>' +
    '<div class="row3"><input id="me-title-en" placeholder="EN"><input id="me-title-fr" placeholder="FR"><input id="me-title-es" placeholder="ES"></div>' +
    '<label>Medium (wording differs per language — typed by hand, not auto-translated) — EN / FR / ES</label>' +
    '<div class="row3"><input id="me-medium-en" placeholder="EN"><input id="me-medium-fr" placeholder="FR"><input id="me-medium-es" placeholder="ES"></div>' +
    '<label>Year</label><input type="number" id="me-year" min="1900" max="2100">' +
    '<div class="hint">Leave Title/EN blank to clear all three title fields on submit; same for Medium/EN.</div>' +
    '<div style="display:flex;gap:10px;margin-top:14px;">' +
    '<button type="button" class="submit" id="me-submit">Save</button>' +
    '<button type="button" id="me-cancel" style="padding:9px 18px;background:#2a2a2a;border:1px solid #3a3a3a;color:#eee;border-radius:6px;cursor:pointer;">Cancel</button>' +
    '</div>';
  backdrop.appendChild(form);
  document.body.appendChild(backdrop);

  document.getElementById('me-title-en').value = t.en || '';
  document.getElementById('me-title-fr').value = t.fr || '';
  document.getElementById('me-title-es').value = t.es || '';
  document.getElementById('me-medium-en').value = m.en || '';
  document.getElementById('me-medium-fr').value = m.fr || '';
  document.getElementById('me-medium-es').value = m.es || '';
  document.getElementById('me-year').value = im.year || '';

  wireAutoTranslate({
    en: document.getElementById('me-title-en'),
    fr: document.getElementById('me-title-fr'),
    es: document.getElementById('me-title-es')
  });

  const close = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) close(); };
  document.getElementById('me-cancel').onclick = close;
  document.getElementById('me-submit').onclick = () => {
    const en = document.getElementById('me-title-en').value.trim();
    const fr = document.getElementById('me-title-fr').value.trim();
    const es = document.getElementById('me-title-es').value.trim();
    const medEn = document.getElementById('me-medium-en').value.trim();
    const medFr = document.getElementById('me-medium-fr').value.trim();
    const medEs = document.getElementById('me-medium-es').value.trim();
    const year = document.getElementById('me-year').value.trim();

    const jobs = [];
    jobs.push(doAction({ type: 'set-meta', gallery: gallery.id, file: im.file, field: 'title', value: en ? { en, fr: fr || en, es: es || en } : null }));
    jobs.push(doAction({ type: 'set-meta', gallery: gallery.id, file: im.file, field: 'medium', value: medEn ? { en: medEn, fr: medFr || medEn, es: medEs || medEn } : null }));
    jobs.push(doAction({ type: 'set-meta', gallery: gallery.id, file: im.file, field: 'year', value: year ? Number(year) : null }));
    Promise.all(jobs).then(close).catch(() => {});
  };
}

// Renames the GALLERY/BRANCH's own display name (what shows as its
// title on the site, e.g. "Scrap and Steel" for branch-industrial) — not
// a photo's museum-label title (that's openMetaEditor above). This was
// the one thing with no edit path at all before 2026-11-13.
function openGalleryTitleEditor(gallery) {
  const t = gallery.title || { en: '', fr: '', es: '' };
  document.querySelectorAll('.modal-backdrop').forEach((n) => n.remove());
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.style = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;';
  const form = document.createElement('form');
  form.className = 'panel';
  form.style = 'margin:0;max-height:90vh;overflow:auto;';
  form.innerHTML = '<h3>Rename gallery — ' + gallery.id + '</h3>' +
    '<div class="hint">This is the gallery/branch\'s own display name (shown on the site), not a photo\'s title.</div>' +
    '<label>Name (auto-translates on blur — edit a field afterward to stop it being overwritten) — EN / FR / ES</label>' +
    '<div class="row3"><input id="gt-en" placeholder="EN"><input id="gt-fr" placeholder="FR"><input id="gt-es" placeholder="ES"></div>' +
    '<div style="display:flex;gap:10px;margin-top:14px;">' +
    '<button type="button" class="submit" id="gt-submit">Save</button>' +
    '<button type="button" id="gt-cancel" style="padding:9px 18px;background:#2a2a2a;border:1px solid #3a3a3a;color:#eee;border-radius:6px;cursor:pointer;">Cancel</button>' +
    '</div>';
  backdrop.appendChild(form);
  document.body.appendChild(backdrop);

  document.getElementById('gt-en').value = t.en || '';
  document.getElementById('gt-fr').value = t.fr || '';
  document.getElementById('gt-es').value = t.es || '';

  wireAutoTranslate({
    en: document.getElementById('gt-en'),
    fr: document.getElementById('gt-fr'),
    es: document.getElementById('gt-es')
  });

  const close = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) close(); };
  document.getElementById('gt-cancel').onclick = close;
  document.getElementById('gt-submit').onclick = () => {
    const en = document.getElementById('gt-en').value.trim();
    const fr = document.getElementById('gt-fr').value.trim();
    const es = document.getElementById('gt-es').value.trim();
    if (!en) { toast('name (at least EN) is required', true); return; }
    doAction({ type: 'set-gallery-title', gallery: gallery.id, title: { en, fr: fr || en, es: es || en } }, gallery.id + ' renamed').then(close).catch(() => {});
  };
}

function renderGalleries() {

  const toolbar = document.createElement('div'); toolbar.className = 'tab-toolbar';

  let allExpanded = false;

// ---------------------------------------------------------------- Trunk tab
function titleBtn(seriesId, file) {
  const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = 'Title';
  btn.onclick = () => {
    const { g, im } = findGalleryAndImage(seriesId, file);
    if (g && im) openMetaEditor(g, im);
  };
  return btn;
}

function trunkRow(set, e) {
  const card = document.createElement('div'); card.className = 'trunk-card';
  const { im: anchorIm } = findGalleryAndImage('trunk', e.file);
  const title = anchorIm && anchorIm.title;

  const head = document.createElement('div'); head.className = 'tc-head';
  head.appendChild(thumbImg('trunk', e.file));
  const tcMain = document.createElement('div'); tcMain.className = 'tc-main';
  const idRow = document.createElement('div'); idRow.className = 'tc-id-row';
  const idTag = document.createElement('span'); idTag.className = 'tc-id'; idTag.textContent = e.id;
  idRow.appendChild(idTag);
  if (e.hasStatement) { const s = document.createElement('span'); s.className = 'tc-statement'; s.textContent = 'has statement'; idRow.appendChild(s); }
  tcMain.appendChild(idRow);
  const titleEl = document.createElement('div'); titleEl.className = 'tc-title' + (title ? '' : ' untitled');
  titleEl.textContent = title ? (title.fr || title.en) : '(no title set)';
  tcMain.appendChild(titleEl);
  const fnEl = document.createElement('div'); fnEl.className = 'tc-fn'; fnEl.textContent = e.file;
  tcMain.appendChild(fnEl);

  const controls = document.createElement('div'); controls.className = 'tc-controls';
  const moveGrp = document.createElement('div'); moveGrp.className = 'grp';
  moveGrp.innerHTML = '<label>Move / reorder</label>';
  const moveRow = document.createElement('div'); moveRow.className = 'grp-row';
  const toSel = document.createElement('select');
  ['current', 'other'].forEach((s) => { const o = document.createElement('option'); o.value = s; o.textContent = s === 'current' ? 'Oeuvre actuelle' : 'Autres travaux'; if (s === set) o.selected = true; toSel.appendChild(o); });
  const posInput = document.createElement('input'); posInput.className = 'posnum'; posInput.placeholder = '#'; posInput.title = 'new position in target page (blank = append)';
  const moveBtn = document.createElement('button'); moveBtn.className = 'go'; moveBtn.textContent = 'Go';
  moveBtn.onclick = () => {
    const pos = posInput.value.trim() === '' ? undefined : Number(posInput.value);
    doAction({ type: 'trunk-reorder', id: e.id, toSet: toSel.value, position: pos }, e.id + ' placed');
  };
  moveRow.appendChild(toSel); moveRow.appendChild(posInput); moveRow.appendChild(moveBtn);
  moveGrp.appendChild(moveRow);
  controls.appendChild(moveGrp);

  const actGrp = document.createElement('div'); actGrp.className = 'grp';
  actGrp.innerHTML = '<label>Photo</label>';
  const actRow = document.createElement('div'); actRow.className = 'grp-row';
  actRow.appendChild(titleBtn('trunk', e.file));
  if (e.related.length) {
    const detachBtn = document.createElement('button'); detachBtn.className = 'danger'; detachBtn.textContent = 'Detach branch';
    detachBtn.onclick = () => { if (confirm('Detach the whole branch from ' + e.id + '? The branch gallery itself is untouched, only the link is removed.')) doAction({ type: 'branch-detach', trunkId: e.id }, 'Detached branch from ' + e.id); };
    actRow.appendChild(detachBtn);
  }
  actGrp.appendChild(actRow);
  controls.appendChild(actGrp);
  tcMain.appendChild(controls);

  head.appendChild(tcMain);
  card.appendChild(head);

  const branchSec = document.createElement('div'); branchSec.className = 'branch-sec';
  if (e.related.length) {
    const branchGallery = STATE.galleries.find((g) => g.id === e.related[0].series);
    const branchTitle = branchGallery && branchGallery.title && (branchGallery.title.fr || branchGallery.title.en);
    const secHead = document.createElement('div'); secHead.style.cssText = 'display:flex;align-items:center;gap:10px;margin-bottom:10px;';
    const h4 = document.createElement('h4'); h4.style.margin = '0';
    h4.textContent = 'Branch — ' + (branchTitle || e.related[0].series) + ' — ' + e.related.length + ' related photo(s)';
    secHead.appendChild(h4);
    if (branchGallery) {
      const renameBranchBtn = document.createElement('button'); renameBranchBtn.type = 'button'; renameBranchBtn.className = 'ghead-btn'; renameBranchBtn.textContent = 'Rename branch';
      renameBranchBtn.onclick = () => openGalleryTitleEditor(branchGallery);
      secHead.appendChild(renameBranchBtn);
    }
    branchSec.appendChild(secHead);
    const grid = document.createElement('div'); grid.className = 'rel-grid';
    e.related.forEach((r, i) => {
      const rc = document.createElement('div'); rc.className = 'rel-card';
      rc.appendChild(thumbImg(r.series, r.file));
      const fnTag = document.createElement('span'); fnTag.className = 'rel-fn'; fnTag.textContent = i + '. ' + r.file;
      rc.appendChild(fnTag);
      const actions = document.createElement('div'); actions.className = 'rel-actions';
      actions.appendChild(titleBtn(r.series, r.file));
      const rpos = document.createElement('input'); rpos.className = 'posnum'; rpos.placeholder = '#'; rpos.title = 'new position';
      const rbtn = document.createElement('button'); rbtn.textContent = 'Reorder';
      rbtn.onclick = () => { if (rpos.value.trim() === '') return; doAction({ type: 'branch-reorder-related', trunkId: e.id, branchSeries: r.series, file: r.file, position: Number(rpos.value) }, 'Reordered'); };
      actions.appendChild(rpos); actions.appendChild(rbtn);
      const rm = document.createElement('button'); rm.className = 'danger'; rm.textContent = 'Remove';
      rm.onclick = () => doAction({ type: 'branch-remove-related', trunkId: e.id, file: r.file }, 'Removed ' + r.file + ' from ' + e.id);
      actions.appendChild(rm);
      rc.appendChild(actions);
      grid.appendChild(rc);
    });
    branchSec.appendChild(grid);
  } else {
    branchSec.innerHTML = '<h4>No branch yet</h4>';
    const attach = document.createElement('div');
    const branchSel = document.createElement('select'); branchSel.style.marginBottom = '8px';
    STATE.galleries.filter((g) => g.id.startsWith('branch-')).forEach((g) => { const o = document.createElement('option'); o.value = g.id; o.textContent = g.id; branchSel.appendChild(o); });
    const grid = document.createElement('div'); grid.className = 'pick-grid';
    function refillGrid() {
      grid.innerHTML = '';
      const g = STATE.galleries.find((x) => x.id === branchSel.value);
      (g ? g.images : []).filter((i) => !i.archived).forEach((i) => {
        const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'pick-thumb';
        btn.title = i.file;
        const img = document.createElement('img'); img.loading = 'lazy'; img.src = thumbUrl(g, i);
        btn.appendChild(img);
        const fnTag = document.createElement('span'); fnTag.className = 'pt-fn'; fnTag.textContent = i.file;
        btn.appendChild(fnTag);
        btn.onclick = () => doAction({ type: 'branch-add-related', trunkId: e.id, branchSeries: branchSel.value, file: i.file }, 'Attached ' + i.file + ' to ' + e.id);
        grid.appendChild(btn);
      });
      if (!grid.children.length) grid.textContent = '(no un-archived photos in this branch yet — upload one first)';
    }
    branchSel.onchange = refillGrid; refillGrid();
    const hint = document.createElement('div'); hint.className = 'hint'; hint.style.margin = '6px 0'; hint.textContent = 'Pick a branch, then click a photo to attach it as the first related photo.';
    attach.appendChild(branchSel); attach.appendChild(hint); attach.appendChild(grid);
    branchSec.appendChild(attach);
  }
  card.appendChild(branchSec);
  return card;
}

function renderTrunk() {
  const main = document.getElementById('panel-trunk');
  main.innerHTML = '';
  [['current', 'Oeuvre actuelle', false], ['other', 'Autres travaux', true]].forEach(([key, label, startCollapsed]) => {
    const wrap = document.createElement('div'); wrap.className = 'gallery' + (startCollapsed ? ' collapsed' : '');
    const head = document.createElement('div'); head.className = 'g-head';
    head.innerHTML = '<b>' + label + '</b><span class="count">' + STATE.trunk[key].length + ' anchor(s)</span>';
    head.onclick = () => wrap.classList.toggle('collapsed');
    wrap.appendChild(head);
    const rows = document.createElement('div'); rows.className = 'trunk-rows';
    STATE.trunk[key].forEach((e) => rows.appendChild(trunkRow(key, e)));
    wrap.appendChild(rows);
    main.appendChild(wrap);
  });

  // create a brand-new trunk anchor from a photo already in GALLERY_DATA.trunk.images
  const form = document.createElement('form'); form.className = 'panel';
  form.innerHTML = '<h3>New trunk anchor</h3><div class="hint">Promotes a photo already in gallery-data.js\'s "trunk" series to a clickable anchor on one of the two pages. Upload into "trunk" first (Upload tab) if the photo isn\'t there yet. Click a photo below to pick it.</div>';
  const trunkGallery = STATE.galleries.find((g) => g.id === 'trunk');
  const grid = document.createElement('div'); grid.className = 'pick-grid';
  let pickedFile = null;
  (trunkGallery ? trunkGallery.images : []).filter((i) => !i.archived).forEach((i) => {
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'pick-thumb'; btn.title = i.file;
    const img = document.createElement('img'); img.loading = 'lazy'; img.src = thumbUrl(trunkGallery, i);
    btn.appendChild(img);
    const fnTag = document.createElement('span'); fnTag.className = 'pt-fn'; fnTag.textContent = i.file;
    btn.appendChild(fnTag);
    btn.onclick = () => {
      pickedFile = i.file;
      grid.querySelectorAll('.pick-thumb').forEach((b) => b.classList.remove('sel'));
      btn.classList.add('sel');
    };
    grid.appendChild(btn);
  });
  const setSel = document.createElement('select');
  [['current', 'Oeuvre actuelle'], ['other', 'Autres travaux']].forEach(([v, l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l; setSel.appendChild(o); });
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'submit'; btn.textContent = 'Create anchor';
  btn.onclick = () => {
    if (!pickedFile) { toast('pick a photo first', true); return; }
    doAction({ type: 'trunk-create-anchor', toSet: setSel.value, file: pickedFile }, 'Anchor created');
  };
  form.appendChild(grid); form.appendChild(setSel); form.appendChild(btn);
  main.appendChild(form);
}

// ---------------------------------------------------------------- Upload tab
function renderUpload() {
  const main = document.getElementById('panel-upload');
  main.innerHTML = '';
  const form = document.createElement('form'); form.className = 'panel';
  form.innerHTML = '<h3>Upload a new photo</h3>' +
    '<div class="hint">Runs .build/compress.js then .build/responsive.js (the real pipeline), writes into images/&lt;gallery&gt;/, and adds the data entry. .jpg/.jpeg only.</div>' +
    '<label>Source file</label><input type="file" id="up-file" accept="image/jpeg">' +
    '<label>Target gallery</label><select id="up-gallery"></select>' +
    '<label>Position (blank = append at end)</label><input type="number" id="up-pos" min="0">' +
    '<label>Alt text (required — EN / FR / ES)</label>' +
    '<div class="row3"><input id="up-alt-en" placeholder="EN"><input id="up-alt-fr" placeholder="FR"><input id="up-alt-es" placeholder="ES"></div>' +
    '<label>Title (optional, museum-label — EN / FR / ES)</label>' +
    '<div class="row3"><input id="up-title-en" placeholder="EN"><input id="up-title-fr" placeholder="FR"><input id="up-title-es" placeholder="ES"></div>' +
    '<label>Medium (optional — EN / FR / ES)</label>' +
    '<div class="row3"><input id="up-medium-en" placeholder="EN"><input id="up-medium-fr" placeholder="FR"><input id="up-medium-es" placeholder="ES"></div>' +
    '<label>Year (optional)</label><input type="number" id="up-year" min="1900" max="2100">' +
    '<label>Attach to a trunk anchor\'s "more like this" (only if target gallery is a branch-*)</label>' +
    '<select id="up-attach"><option value="">— don\'t attach —</option></select>' +
    '<button type="button" class="submit" id="up-submit">Upload</button>';
  main.appendChild(form);

  wireAutoTranslate({
    en: document.getElementById('up-title-en'),
    fr: document.getElementById('up-title-fr'),
    es: document.getElementById('up-title-es')
  });

  const gSel = document.getElementById('up-gallery');
  const { live, rest } = liveGalleryTiers();
  const liveGrp = document.createElement('optgroup'); liveGrp.label = 'Live — trunk, attached branches, in-use galleries';
  live.forEach((id) => { const o = document.createElement('option'); o.value = id; o.textContent = id; liveGrp.appendChild(o); });
  gSel.appendChild(liveGrp);
  if (rest.length) {
    const restGrp = document.createElement('optgroup'); restGrp.label = 'Archived / not currently shown';
    rest.forEach((id) => { const o = document.createElement('option'); o.value = id; o.textContent = id; restGrp.appendChild(o); });
    gSel.appendChild(restGrp);
  }
  const attachSel = document.getElementById('up-attach');
  function refillAttach() {
    attachSel.innerHTML = '<option value="">— don\'t attach —</option>';
    if (!gSel.value.startsWith('branch-')) { attachSel.disabled = true; return; }
    attachSel.disabled = false;
    [...STATE.trunk.current, ...STATE.trunk.other].forEach((e) => { const o = document.createElement('option'); o.value = e.id; o.textContent = e.id; attachSel.appendChild(o); });
  }
  gSel.onchange = refillAttach; refillAttach();

  document.getElementById('up-submit').onclick = async () => {
    const fileInput = document.getElementById('up-file');
    const f = fileInput.files[0];
    if (!f) { toast('pick a file first', true); return; }
    const altEn = document.getElementById('up-alt-en').value.trim();
    const altFr = document.getElementById('up-alt-fr').value.trim();
    const altEs = document.getElementById('up-alt-es').value.trim();
    if (!altEn || !altFr || !altEs) { toast('alt text (EN/FR/ES) is required', true); return; }
    const reader = new FileReader();
    reader.onload = async () => {
      const dataBase64 = reader.result.split(',')[1];
      const titleEn = document.getElementById('up-title-en').value.trim();
      const medEn = document.getElementById('up-medium-en').value.trim();
      const posVal = document.getElementById('up-pos').value;
      const yearVal = document.getElementById('up-year').value;
      const action = {
        type: 'upload',
        gallery: gSel.value,
        filename: f.name,
        dataBase64,
        position: posVal === '' ? undefined : Number(posVal),
        alt: { en: altEn, fr: altFr, es: altEs },
        title: titleEn ? { en: titleEn, fr: document.getElementById('up-title-fr').value.trim() || titleEn, es: document.getElementById('up-title-es').value.trim() || titleEn } : null,
        medium: medEn ? { en: medEn, fr: document.getElementById('up-medium-fr').value.trim() || medEn, es: document.getElementById('up-medium-es').value.trim() || medEn } : null,
        year: yearVal ? Number(yearVal) : null,
        attachToTrunkId: attachSel.value || undefined
      };
      try {
        await doAction(action, 'Uploaded');
        fileInput.value = '';
      } catch (e) { /* toast already shown */ }
    };
    reader.readAsDataURL(f);
  };
}
