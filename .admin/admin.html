<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>W2b — local admin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font: 14px/1.4 system-ui, sans-serif; background: #111; color: #eee; margin: 0; }
  header { padding: 10px 20px; background: #1b1b1b; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .note { color: #777; font-size: 11px; }
  nav.tabs { display: flex; gap: 6px; }
  nav.tabs button { background: #222; color: #ccc; border: 1px solid #333; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  nav.tabs button.on { background: #365; color: #fff; border-color: #487; }
  .pub-wrap { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .pub-btn { background: #2a2a2a; color: #ccc; border: 1px solid #3a3a3a; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 7px; }
  .pub-btn.has-pending { background: #4a3410; border-color: #a06b1f; color: #ffd28a; }
  .pub-btn:disabled { opacity: .4; cursor: default; }
  .pub-badge { background: #e0a030; color: #1b1b1b; border-radius: 10px; padding: 0 7px; font-size: 11px; font-weight: 700; min-width: 18px; text-align: center; }
  main { padding: 18px 20px 40px; max-width: 1400px; margin: 0 auto; }
  section.tabpanel { display: none; }
  section.tabpanel.on { display: block; }
  .tab-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .tab-toolbar .hint { color: #777; font-size: 11px; }
  .tab-toolbar .expand-all { background: none; border: 1px solid #333; color: #999; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 11px; }
  .gallery { margin-bottom: 10px; border: 1px solid #2a2a2a; border-radius: 8px; overflow: hidden; }
  .gtier-label { margin: 22px 0 10px; padding-top: 14px; border-top: 1px dashed #333; font-size: 11px; color: #887; text-transform: uppercase; letter-spacing: .07em; }
  .gtier-inactive { opacity: .6; }
  .gallery > .g-head { padding: 9px 14px; background: #1b1b1b; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .gallery > .g-head:hover { background: #202020; }
  .gallery > .g-head::before { content: '▸'; color: #666; font-size: 10px; transition: transform .15s; }
  .gallery:not(.collapsed) > .g-head::before { transform: rotate(90deg); }
  .gallery > .g-head b { font-size: 13px; }
  .gallery > .g-head .count { color: #888; font-size: 11px; }
  .gallery > .g-head .archcount { color: #e0a030; }
  .ghead-btn { background: #2a2a2a; color: #ccc; border: 1px solid #3a3a3a; border-radius: 4px; padding: 4px 9px; font-size: 11px; cursor: pointer; }
  .ghead-btn:hover { background: #3a3a3a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 12px; }
  .card { background: #1b1b1b; border: 1px solid #2a2a2a; border-radius: 6px; overflow: hidden; }
  .card.archived { opacity: .45; }
  .card img { width: 100%; height: 100px; object-fit: cover; display: block; background: #000; }
  .card .meta { padding: 6px 8px; }
  .card .fn { font-size: 10px; color: #999; word-break: break-all; display: block; max-height: 2.6em; overflow: hidden; }
  .card .mlabel { font-size: 10px; color: #e0a030; margin-top: 2px; }
  .card .row { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .card button, .card select, .card input { font-size: 10px; padding: 3px 5px; background: #2a2a2a; color: #eee; border: 1px solid #3a3a3a; border-radius: 4px; }
  .card button { cursor: pointer; }
  .card button:hover { background: #3a3a3a; }
  .card button.danger { border-color: #633; }
  .card button.go { border-color: #365; }
  .card input.posnum { width: 36px; }
  .trunk-card { background: #181818; border: 1px solid #272727; border-radius: 8px; padding: 14px; margin: 12px 14px; cursor: grab; }
  .trunk-card.dragging, .rel-card.dragging { opacity: .35; }
  .tc-head { display: flex; gap: 14px; }
  .tc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .tc-id-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .tc-id { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: .07em; background: #222; padding: 2px 6px; border-radius: 4px; }
  .tc-statement { font-size: 10px; color: #6a8; }
  .tc-title { font-size: 14px; color: #eee; }
  .tc-title.untitled { color: #666; font-style: italic; }
  .tc-fn { font-size: 10px; color: #777; word-break: break-all; }
  .tc-controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .tc-controls .grp { display: flex; flex-direction: column; gap: 3px; }
  .tc-controls .grp label { font-size: 9px; color: #777; text-transform: uppercase; letter-spacing: .05em; }
  .tc-controls .grp-row { display: flex; gap: 5px; }
  .branch-sec { margin-top: 14px; padding-top: 12px; border-top: 1px solid #262626; }
  .branch-sec h4 { margin: 0 0 10px; font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: .07em; }
  .rel-grid { display: flex; flex-wrap: wrap; gap: 14px; }
  .rel-card { width: 112px; cursor: grab; }
  .rel-card .rel-fn { display: block; font-size: 9px; color: #999; word-break: break-all; margin: 5px 0 4px; max-height: 2.4em; overflow: hidden; }
  .rel-card .rel-actions { display: flex; flex-wrap: wrap; gap: 3px; }
  .rel-card .rel-actions > button[type="button"]:first-child { flex: 1 1 100%; }
  .rel-card .reorder-grp { display: flex; gap: 3px; flex: 1 1 100%; }
  .rel-card .reorder-grp button { flex: 1; }
  .rel-card .rel-actions input.posnum { width: 30px; }
  .rel-card .rel-actions > button.danger { flex: 1 1 100%; }
  .trunk-card button, .trunk-card select, .trunk-card input { font-size: 11px; padding: 5px 8px; background: #2a2a2a; color: #eee; border: 1px solid #3a3a3a; border-radius: 4px; }
  .trunk-card button { cursor: pointer; }
  .trunk-card button:hover { background: #3a3a3a; }
  .trunk-card button.danger { border-color: #633; }
  .trunk-card button.go { border-color: #365; }
  .trunk-card input.posnum { width: 44px; padding: 5px 6px; }
  .thumb { width: 112px; height: 112px; object-fit: cover; border-radius: 6px; background: #000; flex-shrink: 0; display: block; }
  .rel-item .thumb { width: 88px; height: 88px; }
  .pick-grid { display: flex; gap: 10px; flex-wrap: wrap; padding: 4px 0; max-width: 100%; }
  .pick-thumb { position: relative; border: 2px solid transparent; border-radius: 7px; padding: 0; background: none; cursor: pointer; line-height: 0; }
  .pick-thumb img { width: 140px; height: 140px; object-fit: cover; border-radius: 5px; display: block; }
  .pick-thumb:hover { border-color: #487; }
  .pick-thumb.sel { border-color: #6c9; }
  .pick-thumb.archived { opacity: .5; }
  .pick-thumb.archived.sel { opacity: 1; }
  .pick-thumb .pt-fn { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; background: rgba(0,0,0,.7); color: #ccc; padding: 3px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 0 0 5px 5px; }
  .toast { position: fixed; bottom: 16px; right: 16px; background: #222; border: 1px solid #444; padding: 10px 16px; border-radius: 6px; max-width: 360px; font-size: 13px; z-index: 50; }
  .toast.err { border-color: #633; color: #f99; }
  .toast.ok { border-color: #365; color: #9f9; }
  .collapsed .grid, .collapsed .trunk-rows { display: none; }
  form.panel { background: #1b1b1b; border: 1px solid #2a2a2a; border-radius: 8px; padding: 16px; margin-bottom: 20px; max-width: 640px; overscroll-behavior: contain; }
  form.panel h3 { margin: 0 0 12px; font-size: 14px; }
  form.panel label { display: block; margin: 10px 0 3px; font-size: 12px; color: #aaa; }
  form.panel input, form.panel select, form.panel textarea { width: 100%; padding: 7px; background: #111; border: 1px solid #333; color: #eee; border-radius: 5px; font-size: 13px; }
  form.panel .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  form.panel button.submit { margin-top: 14px; padding: 9px 18px; background: #365; border: 1px solid #487; color: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; }
  form.panel .hint { font-size: 11px; color: #777; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>W2b art — local admin</h1>
  <span class="note">local only · never deployed</span>
  <nav class="tabs">
    <button data-tab="galleries" class="on">Galleries</button>
    <button data-tab="trunk">Trunk / branches</button>
    <button data-tab="upload">Upload</button>
    <button data-tab="newbranch">New branch</button>
    <button data-tab="afterdark">After Dark (18+)</button>
  </nav>
  <div class="pub-wrap">
    <button class="pub-btn" id="pub-btn" type="button" title="Review and push pending changes">
      <span id="pub-label">Publish</span><span class="pub-badge" id="pub-badge" style="display:none">0</span>
    </button>
  </div>
</header>
<main id="main">Loading…</main>
<script>
let STATE = null;
// Which collapsible .gallery sections (Galleries tab: gallery id; Trunk
// tab: 'trunk-current'/'trunk-other') are expanded — survives renderAll()
// so an action taken in one section doesn't collapse every other one.
let OPEN_SECTIONS = new Set(['trunk-current']);

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok || j.ok === false) throw new Error(j.error || 'request failed');
  return j;
}
function toast(msg, isErr) {
  const t = document.createElement('div');
  t.className = 'toast ' + (isErr ? 'err' : 'ok');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), isErr ? 7000 : 3000);
}
async function doAction(action, successMsg, silent) {
  try {
    const r = await api('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(action) });
    STATE = r.state;
    renderAll();
    if (!silent) toast(successMsg || r.message || 'done');
    refreshPublishStatus();
    return r;
  } catch (e) {
    toast(e.message, true);
    throw e;
  }
}

// ---------------------------------------------------------------- Publish (scoped git add+commit+push)
let PENDING_FILES = [];
async function refreshPublishStatus() {
  try {
    const r = await api('/api/git/status');
    PENDING_FILES = r.files;
    const btn = document.getElementById('pub-btn');
    const badge = document.getElementById('pub-badge');
    if (PENDING_FILES.length) {
      btn.classList.add('has-pending');
      badge.style.display = '';
      badge.textContent = PENDING_FILES.length;
    } else {
      btn.classList.remove('has-pending');
      badge.style.display = 'none';
    }
  } catch (e) { /* git not available or not a repo — leave the button inert, non-fatal */ }
}

function openPublishModal() {
  document.querySelectorAll('.modal-backdrop').forEach((n) => n.remove());
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.style = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;';
  const form = document.createElement('form');
  form.className = 'panel';
  form.style = 'margin:0;max-width:560px;max-height:85vh;overflow:auto;';

  const fileRows = PENDING_FILES.length
    ? '<ul style="list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;border:1px solid #2a2a2a;border-radius:6px;">' +
      PENDING_FILES.map((f) => '<li style="padding:5px 10px;font-size:11px;color:#bbb;border-bottom:1px solid #222;display:flex;gap:8px;"><span style="color:#e0a030;width:18px;flex-shrink:0;">' + f.status + '</span><span style="word-break:break-all;">' + f.file + '</span></li>').join('') +
      '</ul>'
    : '<div class="hint">Nothing pending.</div>';

  form.innerHTML = '<h3>Publish changes</h3>' +
    '<div class="hint">Commits and pushes only what this tool itself can touch — images/, gallery-data.js, trunk-data.js, responsive-manifest.js. Nothing else, even if something else in this folder happens to be modified.</div>' +
    '<label>' + PENDING_FILES.length + ' file(s) pending</label>' + fileRows +
    '<label>Commit message (optional)</label><textarea id="pub-msg" rows="2" placeholder="Leave blank for an auto-generated message"></textarea>' +
    '<div style="display:flex;gap:10px;margin-top:14px;">' +
    '<button type="button" class="submit" id="pub-confirm"' + (PENDING_FILES.length ? '' : ' disabled') + '>Commit &amp; push</button>' +
    '<button type="button" id="pub-cancel" style="padding:9px 18px;background:#2a2a2a;border:1px solid #3a3a3a;color:#eee;border-radius:6px;cursor:pointer;">Cancel</button>' +
    '</div>';
  backdrop.appendChild(form);
  document.body.appendChild(backdrop);

  const close = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) close(); };
  document.getElementById('pub-cancel').onclick = close;
  document.getElementById('pub-confirm').onclick = async () => {
    const btn = document.getElementById('pub-confirm');
    btn.disabled = true; btn.textContent = 'Publishing…';
    try {
      const message = document.getElementById('pub-msg').value.trim();
      const r = await api('/api/git/publish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) });
      toast('Pushed ' + r.sha + ' to ' + r.branch + ' (' + r.filesCount + ' file(s))');
      close();
      refreshPublishStatus();
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false; btn.textContent = 'Commit & push';
    }
  };
}
document.getElementById('pub-btn').onclick = openPublishModal;
function galleryIds() { return STATE.galleries.map((g) => g.id); }
// Splits galleries into "live" (trunk, any branch-* actually attached to a
// trunk anchor, and any other gallery with at least one non-archived
// photo) vs. "rest" (fully archived or an orphaned branch) — used to put
// what you'd actually want to upload into first, in the Upload tab's
// target-gallery picker. trunk first, then attached branches in the
// order they appear on the two trunk pages, then other live galleries
// alphabetically.
function liveGalleryTiers() {
  const attachedBranches = [];
  [...STATE.trunk.current, ...STATE.trunk.other].forEach((e) => {
    (e.related || []).forEach((r) => { if (!attachedBranches.includes(r.series)) attachedBranches.push(r.series); });
  });
  const live = [];
  if (STATE.galleries.some((g) => g.id === 'trunk')) live.push('trunk');
  attachedBranches.forEach((id) => { if (STATE.galleries.some((g) => g.id === id)) live.push(id); });
  const otherLive = STATE.galleries
    .filter((g) => g.id !== 'trunk' && !attachedBranches.includes(g.id) && g.images.some((i) => !i.archived))
    .map((g) => g.id)
    .sort();
  live.push(...otherLive);
  const rest = STATE.galleries.map((g) => g.id).filter((id) => !live.includes(id)).sort();
  return { live, rest };
}
function imgUrl(gallery, im) {
  const dir = im.archived ? '_archive/' + gallery.id : gallery.folder.replace(/^images\//, '').replace(/\/$/, '');
  return '/img/' + encodeURIComponent(dir) + '/' + encodeURIComponent(im.file);
}
// Same folder logic as imgUrl, but via /thumb/ (server prefers an existing
// -800w derivative, never generates one) — used anywhere in the Trunk/
// branches tab that shows or picks a photo, so it never pulls full-size
// originals just to render a filename list.
function thumbUrl(gallery, im) {
  const dir = im.archived ? '_archive/' + gallery.id : gallery.folder.replace(/^images\//, '').replace(/\/$/, '');
  return '/thumb/' + encodeURIComponent(dir) + '/' + encodeURIComponent(im.file);
}
function findGalleryAndImage(seriesId, file) {
  const g = STATE.galleries.find((x) => x.id === seriesId);
  const im = g && g.images.find((i) => i.file === file);
  return { g, im };
}
function thumbImg(seriesId, file) {
  const img = document.createElement('img');
  img.className = 'thumb';
  img.loading = 'lazy';
  img.draggable = false; // so dragging a draggable ancestor card doesn't drag the <img> itself
  const { g, im } = findGalleryAndImage(seriesId, file);
  img.src = (g && im) ? thumbUrl(g, im) : '';
  img.alt = '';
  return img;
}

// Generic drag-to-reorder for a list of sibling elements: wires dragstart/
// dragover/drop on `container`, live-reorders the DOM for visual feedback,
// and calls `onDrop(newIndex, draggedEl)` once the drop lands — the caller
// fires the real reorder action; the next renderAll() makes the server's
// order authoritative either way.
function enableDragReorder(container, itemSelector, onDrop) {
  container.addEventListener('dragover', (ev) => {
    const dragging = container.querySelector(itemSelector + '.dragging');
    if (!dragging) return;
    ev.preventDefault();
    const target = ev.target.closest(itemSelector);
    if (!target || target === dragging || target.parentNode !== container) return;
    const rect = target.getBoundingClientRect();
    const before = (ev.clientX - rect.left) / rect.width + (ev.clientY - rect.top) / rect.height < 1;
    container.insertBefore(dragging, before ? target : target.nextSibling);
  });
  container.addEventListener('drop', (ev) => {
    const dragging = container.querySelector(itemSelector + '.dragging');
    if (!dragging) return;
    ev.preventDefault();
    onDrop(Array.from(container.children).indexOf(dragging), dragging);
  });
}
function makeDraggable(el) {
  el.draggable = true;
  el.ondragstart = (ev) => { ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', ''); el.classList.add('dragging'); };
  el.ondragend = () => el.classList.remove('dragging');
}

// ---------------------------------------------------------------- Title auto-translate (museum-label title only)
async function translateViaApi(text, from, targets) {
  const r = await fetch('/api/translate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, from, targets }) });
  const j = await r.json();
  if (!r.ok || j.ok === false) throw new Error(j.error || 'translate failed');
  return j.translations;
}
// fields = {en: <input>, fr: <input>, es: <input>}. Fills a language's
// field on blur of whichever field he just typed in, but only into
// fields he hasn't hand-edited himself this session (or that are still
// empty) — never overwrites a field he already corrected. Nothing is
// saved anywhere by this; it only sets .value on the form inputs.
function wireAutoTranslate(fields) {
  const dirty = { en: false, fr: false, es: false };
  let autoFilling = false;
  Object.keys(fields).forEach((lang) => {
    const el = fields[lang];
    if (!el) return;
    el.addEventListener('input', () => { if (!autoFilling) dirty[lang] = true; });
    el.addEventListener('blur', async () => {
      const text = el.value.trim();
      if (!text) return;
      const targets = Object.keys(fields).filter((l) => l !== lang && fields[l] && !dirty[l]);
      if (!targets.length) return;
      try {
        const translations = await translateViaApi(text, lang, targets);
        autoFilling = true;
        targets.forEach((l) => { if (translations[l] != null) fields[l].value = translations[l]; });
        autoFilling = false;
      } catch (e) {
        toast('Auto-translate failed (type the other languages by hand): ' + e.message, true);
      }
    });
  });
}

// ---------------------------------------------------------------- Galleries tab
function metaLabel(im) {
  if (im.title) return (im.title.fr || im.title.en) + (im.year ? ' · ' + im.year : '');
  return '';
}
function card(gallery, im) {
  const div = document.createElement('div');
  div.className = 'card' + (im.archived ? ' archived' : '');
  const img = document.createElement('img');
  img.loading = 'lazy';
  img.src = imgUrl(gallery, im);
  div.appendChild(img);
  const meta = document.createElement('div'); meta.className = 'meta';
  const fn = document.createElement('span'); fn.className = 'fn'; fn.textContent = im.file;
  meta.appendChild(fn);
  const ml = metaLabel(im);
  if (ml) { const m = document.createElement('div'); m.className = 'mlabel'; m.textContent = ml; meta.appendChild(m); }
  const row = document.createElement('div'); row.className = 'row';

  if (im.archived) {
    const btn = document.createElement('button'); btn.className = 'go'; btn.textContent = 'Restore';
    btn.onclick = () => doAction({ type: 'unarchive', gallery: gallery.id, file: im.file }, 'Restored ' + im.file);
    row.appendChild(btn);
  } else {
    const btn = document.createElement('button'); btn.className = 'danger'; btn.textContent = 'Archive';
    btn.onclick = () => doAction({ type: 'archive', gallery: gallery.id, file: im.file }, 'Archived ' + im.file);
    row.appendChild(btn);

    const sel = document.createElement('select');
    const opt0 = document.createElement('option'); opt0.textContent = 'Move to…'; opt0.value = '';
    sel.appendChild(opt0);
    galleryIds().forEach((id) => {
      if (id === gallery.id) return;
      const o = document.createElement('option'); o.value = id; o.textContent = id;
      sel.appendChild(o);
    });
    const posInput = document.createElement('input'); posInput.className = 'posnum'; posInput.placeholder = '#'; posInput.title = 'position (blank = end)';
    sel.onchange = () => {
      if (!sel.value) return;
      const to = sel.value;
      const pos = posInput.value.trim() === '' ? undefined : Number(posInput.value);
      doAction({ type: 'place', from: gallery.id, to, file: im.file, position: pos }, 'Moved ' + im.file + ' → ' + to);
      sel.value = '';
    };
    row.appendChild(sel); row.appendChild(posInput);

    const editBtn = document.createElement('button'); editBtn.textContent = 'Edit label…';
    editBtn.onclick = () => openMetaEditor(gallery, im);
    row.appendChild(editBtn);
  }
  meta.appendChild(row);
  div.appendChild(meta);
  return div;
}

// Guillaume's whole body of work only ever has one of these two media —
// no manual trilingual typing needed, just pick one. One-line addition
// here if a third ever shows up; not a generic tag system on purpose.
const MEDIUM_LOOKUP = {
  digital: { en: 'Digital photograph', fr: 'Photographie numérique', es: 'Fotografía digital' },
  analog: { en: 'Analog photograph', fr: 'Photographie argentique', es: 'Fotografía analógica' }
};
function mediumSelectHtml(id) {
  return '<select id="' + id + '"><option value="">— not set —</option><option value="digital">Digital</option><option value="analog">Analog · Film</option></select>';
}
// Which lookup key (if any) a stored {en,fr,es} medium value matches —
// used to pre-select the right option when editing a photo that already
// has one set.
function mediumKeyFor(m) {
  if (!m) return '';
  const key = Object.keys(MEDIUM_LOOKUP).find((k) => MEDIUM_LOOKUP[k].en === m.en);
  return key || '';
}

function openMetaEditor(gallery, im) {
  const t = im.title || { en: '', fr: '', es: '' };
  const m = im.medium || { en: '', fr: '', es: '' };

// Permanently removes a branch-* gallery: archives every still-live
// photo in it (file move only, never deleted), detaches it from any
// anchor, then drops the now-empty data entry and folder. Destructive
// enough that Guillaume clicking this himself needs the safety built
// into the UI, not a conversation with me first — hence type-the-id-to-
// confirm rather than a single OK/Cancel dialog that's easy to blow
// through on autopilot.
function openDeleteBranchConfirm(gallery) {
  document.querySelectorAll('.modal-backdrop').forEach((n) => n.remove());
  const liveCount = gallery.images.filter((i) => !i.archived).length;
  const archivedCount = gallery.images.length - liveCount;
  const attachedAnchors = [...STATE.trunk.current, ...STATE.trunk.other].filter((e) => (e.related || []).some((r) => r.series === gallery.id));
  const anchorsWithStatement = attachedAnchors.filter((e) => e.hasStatement);
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.style = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;';
  const form = document.createElement('form');
  form.className = 'panel';
  form.style = 'margin:0;max-width:480px;';
  form.innerHTML = '<h3 style="color:#f99;">Delete ' + gallery.id + '</h3>' +
    '<div class="hint">This will archive ' + liveCount + ' photo(s) still live in this branch (moved to images/_archive/' + gallery.id + '/, never deleted)' +
    (archivedCount ? ' — ' + archivedCount + ' already archived in it are left where they are' : '') +
    (attachedAnchors.length
      ? ', and delete the anchor' + (attachedAnchors.length > 1 ? 's' : '') + ' ' + attachedAnchors.map((e) => e.id).join(', ') + ' entirely (its own photo is kept, unpromoted, in the trunk pool — only the clickable anchor tile and its link to this branch go away).'
      : ', then remove the branch itself (the empty gallery entry and its folder).') +
    (anchorsWithStatement.length
      ? '<br><b style="color:#f99;">' + anchorsWithStatement.map((e) => e.id).join(', ') + ' has a written statement — deleting the anchor deletes that text too, it is not kept anywhere.</b>'
      : '') +
    ' This cannot be undone from inside this tool.</div>' +
    '<label>Type <b>' + gallery.id + '</b> to confirm</label>' +
    '<input id="db-confirm" placeholder="' + gallery.id + '" autocomplete="off">' +
    '<div style="display:flex;gap:10px;margin-top:14px;">' +
    '<button type="button" class="submit danger" id="db-submit" disabled>Delete branch</button>' +
    '<button type="button" id="db-cancel" style="padding:9px 18px;background:#2a2a2a;border:1px solid #3a3a3a;color:#eee;border-radius:6px;cursor:pointer;">Cancel</button>' +
    '</div>';
  backdrop.appendChild(form);
  document.body.appendChild(backdrop);

  const input = document.getElementById('db-confirm');
  const submitBtn = document.getElementById('db-submit');
  submitBtn.style.background = '#522'; submitBtn.style.borderColor = '#844';
  input.oninput = () => { submitBtn.disabled = input.value.trim() !== gallery.id; };
  const close = () => backdrop.remove();
  backdrop.onclick = (ev) => { if (ev.target === backdrop) close(); };
  document.getElementById('db-cancel').onclick = close;
  submitBtn.onclick = () => {
    if (input.value.trim() !== gallery.id) return;
    doAction({ type: 'delete-branch', gallery: gallery.id }, gallery.id + ' deleted').then(close).catch(() => {});
  };
}

function renderGalleries() {
  const main = document.getElementById('panel-galleries');
  main.innerHTML = '';
  const toolbar = document.createElement('div'); toolbar.className = 'tab-toolbar';
  toolbar.innerHTML = '<span class="hint">' + STATE.galleries.length + ' galleries — trunk/branch-* included, same as any other</span>';
  const allOpen = STATE.galleries.length > 0 && STATE.galleries.every((g) => OPEN_SECTIONS.has(g.id));
  const expandBtn = document.createElement('button'); expandBtn.type = 'button'; expandBtn.className = 'expand-all'; expandBtn.textContent = allOpen ? 'Collapse all' : 'Expand all';
  expandBtn.onclick = () => {
    const open = expandBtn.textContent === 'Expand all';
    STATE.galleries.forEach((g) => { if (open) OPEN_SECTIONS.add(g.id); else OPEN_SECTIONS.delete(g.id); });
    renderGalleries();
  };
  toolbar.appendChild(expandBtn);
  main.appendChild(toolbar);

  function renderGalleryBlock(g) {
    const wrap = document.createElement('div'); wrap.className = 'gallery' + (OPEN_SECTIONS.has(g.id) ? '' : ' collapsed');
    const head = document.createElement('div'); head.className = 'g-head';
    const archivedCount = g.images.filter((i) => i.archived).length;
    head.innerHTML = '<b>' + g.id + '</b><span class="count">' + g.images.length + ' image(s)' + (archivedCount ? ', <span class="archcount">' + archivedCount + ' archived</span>' : '') + '</span>';
    head.onclick = () => { wrap.classList.toggle('collapsed'); if (wrap.classList.contains('collapsed')) OPEN_SECTIONS.delete(g.id); else OPEN_SECTIONS.add(g.id); };
    const renameBtn = document.createElement('button'); renameBtn.type = 'button'; renameBtn.className = 'ghead-btn'; renameBtn.textContent = 'Rename';
    renameBtn.style.marginLeft = 'auto';
    renameBtn.onclick = (ev) => { ev.stopPropagation(); openGalleryTitleEditor(g); };
    head.appendChild(renameBtn);
    if (g.id.startsWith('branch-')) {
      const deleteBtn = document.createElement('button'); deleteBtn.type = 'button'; deleteBtn.className = 'ghead-btn'; deleteBtn.textContent = 'Delete branch'; deleteBtn.style.borderColor = '#633'; deleteBtn.style.color = '#f99';
      deleteBtn.onclick = (ev) => { ev.stopPropagation(); openDeleteBranchConfirm(g); };
      head.appendChild(deleteBtn);
    }
    wrap.appendChild(head);
    const grid = document.createElement('div'); grid.className = 'grid';
    g.images.forEach((im) => grid.appendChild(card(g, im)));
    wrap.appendChild(grid);
    return wrap;
  }

  // Physically split into two blocks (not just an inline badge): "live"
  // is trunk + attached branches + any other gallery with un-archived
  // photos; everything else (orphaned/fully-archived galleries) renders
  // below a divider, dimmed, so the two can't visually blend together.
  const { live, rest } = liveGalleryTiers();
  const byId = (id) => STATE.galleries.find((g) => g.id === id);

  const activeWrap = document.createElement('div');
  live.forEach((id) => { const g = byId(id); if (g) activeWrap.appendChild(renderGalleryBlock(g)); });
  main.appendChild(activeWrap);

  if (rest.length) {
    const divider = document.createElement('div'); divider.className = 'gtier-label';
    divider.textContent = 'Inactive — not currently shown on the site (' + rest.length + ')';
    main.appendChild(divider);
    const restWrap = document.createElement('div'); restWrap.className = 'gtier-inactive';
    rest.forEach((id) => { const g = byId(id); if (g) restWrap.appendChild(renderGalleryBlock(g)); });
    main.appendChild(restWrap);
  }
}

// "Add a photo to this branch" — covers both halves of the gap: pulling
// in a photo that already lives elsewhere (live in another gallery, or
// sitting in _archive/ from an earlier archive), and jumping to Upload
// pre-filled for a brand-new one. Without this, the only way in was the
// Galleries tab's per-photo "Move to…" select (for a live photo) or
// knowing Upload's branch-target dropdown existed at all (for a new one
// or an archived one, since restoring doesn't also relocate it).
function openAddPhotoToBranch(branchGallery, attachAnchorId) {
  document.querySelectorAll('.modal-backdrop').forEach((n) => n.remove());
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.style = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;';
  const form = document.createElement('form');
  form.className = 'panel';
  form.style = 'margin:0;max-width:680px;max-height:85vh;overflow:auto;overscroll-behavior:contain;';
  form.innerHTML = '<h3>Add photos to ' + branchGallery.id + '</h3><div class="hint">Click as many as you want, then confirm.</div>';
  const close = () => backdrop.remove();

  // selection state: key -> { source, g, i } ; key disambiguates across
  // galleries since the archive grid spans all of them at once.
  const selected = new Map();
  const keyOf = (g, i) => g.id + '\u0000' + i.file;

  const bar = document.createElement('div');
  bar.style.cssText = 'position:sticky;top:0;background:#1b1b1b;padding:8px 0;margin-bottom:4px;display:flex;align-items:center;gap:10px;z-index:1;';
  const countEl = document.createElement('span'); countEl.className = 'hint';
  const addBtn = document.createElement('button'); addBtn.type = 'button'; addBtn.className = 'submit'; addBtn.style.marginTop = '0';
  bar.appendChild(countEl); bar.appendChild(addBtn);
  form.appendChild(bar);

  function refreshBar() {
    countEl.textContent = selected.size ? selected.size + ' selected' : 'nothing selected yet';
    addBtn.textContent = selected.size ? 'Add ' + selected.size + ' photo(s) to ' + branchGallery.id : 'Add to ' + branchGallery.id;
    addBtn.disabled = !selected.size;
  }
  function toggle(key, entry, btn) {
    if (selected.has(key)) { selected.delete(key); btn.classList.remove('sel'); }
    else { selected.set(key, entry); btn.classList.add('sel'); }
    refreshBar();
  }

  const liveLabel = document.createElement('label'); liveLabel.textContent = 'Bring in photos already live in another gallery';
  form.appendChild(liveLabel);
  const gallerySel = document.createElement('select'); gallerySel.style.marginBottom = '8px';
  STATE.galleries.filter((g) => g.id !== branchGallery.id).forEach((g) => { const o = document.createElement('option'); o.value = g.id; o.textContent = g.id; gallerySel.appendChild(o); });
  gallerySel.value = 'trunk';
  form.appendChild(gallerySel);
  const liveGrid = document.createElement('div'); liveGrid.className = 'pick-grid';
  function refillLiveGrid() {
    liveGrid.innerHTML = '';
    const g = STATE.galleries.find((x) => x.id === gallerySel.value);
    (g ? g.images : []).filter((i) => !i.archived).forEach((i) => {
      const key = keyOf(g, i);
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'pick-thumb' + (selected.has(key) ? ' sel' : ''); btn.title = i.file;
      const img = document.createElement('img'); img.loading = 'lazy'; img.src = thumbUrl(g, i);
      btn.appendChild(img);
      const fnTag = document.createElement('span'); fnTag.className = 'pt-fn'; fnTag.textContent = i.file;
      btn.appendChild(fnTag);
      btn.onclick = () => toggle(key, { source: 'live', g, i }, btn);
      liveGrid.appendChild(btn);
    });
    if (!liveGrid.children.length) liveGrid.textContent = '(no un-archived photos in ' + gallerySel.value + ')';
  }
  gallerySel.onchange = refillLiveGrid; refillLiveGrid();
  form.appendChild(liveGrid);

  const archived = [];
  STATE.galleries.forEach((g) => g.images.forEach((i) => { if (i.archived) archived.push({ g, i }); }));
  if (archived.length) {
    const archLabel = document.createElement('label'); archLabel.style.marginTop = '14px'; archLabel.textContent = 'Or restore from the archive (' + archived.length + ')';
    form.appendChild(archLabel);
    const archGrid = document.createElement('div'); archGrid.className = 'pick-grid';
    archived.forEach(({ g, i }) => {
      const key = keyOf(g, i);
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'pick-thumb' + (selected.has(key) ? ' sel' : ''); btn.title = i.file + ' (archived from ' + g.id + ')';
      const img = document.createElement('img'); img.loading = 'lazy'; img.src = thumbUrl(g, i);
      btn.appendChild(img);
      const fnTag = document.createElement('span'); fnTag.className = 'pt-fn'; fnTag.textContent = i.file;
      btn.appendChild(fnTag);
      btn.onclick = () => toggle(key, { source: 'archive', g, i }, btn);
      archGrid.appendChild(btn);
    });
    form.appendChild(archGrid);
  }

  addBtn.onclick = async () => {
    addBtn.disabled = true;
    const items = Array.from(selected.values());
    let done = 0;
    try {
      for (const { source, g, i } of items) {
        if (source === 'archive') await doAction({ type: 'unarchive', gallery: g.id, file: i.file }, null, true);
        if (g.id !== branchGallery.id) {
          // place already attaches it into the branch's related[] too
          // (server-side, so every other "move into a branch" path gets
          // the same behavior) — only call branch-add-related ourselves
          // for the no-move case below, so it isn't attached twice.
          await doAction({ type: 'place', from: g.id, to: branchGallery.id, file: i.file }, null, true);
        } else {
          await doAction({ type: 'branch-add-related', trunkId: attachAnchorId, branchSeries: branchGallery.id, file: i.file }, null, true);
        }
        done++;
      }
      toast('Added ' + done + ' photo(s) to ' + branchGallery.id);
      close();
    } catch (e) {
      toast((done ? done + ' added, then failed: ' : 'failed: ') + e.message, true);
      addBtn.disabled = false;
    }
  };
  refreshBar();

  const uploadBtn = document.createElement('button'); uploadBtn.type = 'button'; uploadBtn.className = 'submit'; uploadBtn.style.marginTop = '14px'; uploadBtn.textContent = 'Or upload a brand-new photo…';
  uploadBtn.onclick = () => goToUpload(branchGallery.id, attachAnchorId);
  form.appendChild(uploadBtn);
  const cancelBtn = document.createElement('button'); cancelBtn.type = 'button'; cancelBtn.textContent = 'Cancel';
  cancelBtn.style.cssText = 'margin-top:10px;margin-left:10px;padding:9px 18px;background:#2a2a2a;border:1px solid #3a3a3a;color:#eee;border-radius:6px;cursor:pointer;';
  form.appendChild(cancelBtn);

  backdrop.appendChild(form);
  document.body.appendChild(backdrop);
  backdrop.onclick = (ev) => { if (ev.target === backdrop) close(); };
  cancelBtn.onclick = close;
}

  moveGrp.innerHTML = '<label>Move / reorder</label>';
  const moveRow = document.createElement('div'); moveRow.className = 'grp-row';
  const toSel = document.createElement('select');
  ['current', 'other'].forEach((s) => { const o = document.createElement('option'); o.value = s; o.textContent = s === 'current' ? 'Oeuvre actuelle' : 'Autres travaux'; if (s === set) o.selected = true; toSel.appendChild(o); });
  const posInput = document.createElement('input'); posInput.className = 'posnum'; posInput.placeholder = '#'; posInput.title = 'new position in target page (blank = append)';
  const moveBtn = document.createElement('button'); moveBtn.className = 'go'; moveBtn.textContent = 'Go';
  moveBtn.onclick = () => {
    const pos = posInput.value.trim() === '' ? undefined : Number(posInput.value);
    doAction({ type: 'trunk-reorder', id: e.id, toSet: toSel.value, position: pos }, e.id + ' placed');
  };
  moveRow.appendChild(toSel); moveRow.appendChild(posInput); moveRow.appendChild(moveBtn);
  moveGrp.appendChild(moveRow);
  controls.appendChild(moveGrp);

  const actGrp = document.createElement('div'); actGrp.className = 'grp';
  actGrp.innerHTML = '<label>Photo</label>';
  const actRow = document.createElement('div'); actRow.className = 'grp-row';
  actRow.appendChild(titleBtn('trunk', e.file));
  const replaceBtn = document.createElement('button'); replaceBtn.type = 'button'; replaceBtn.textContent = 'Replace';
  replaceBtn.title = 'swap the photo this anchor points to — same id, same position, same branch, only the picture changes';
  replaceBtn.onclick = () => openReplaceAnchorPhoto(e.id, e.file);
  actRow.appendChild(replaceBtn);
  if (e.related.length) {
    const detachBtn = document.createElement('button'); detachBtn.className = 'danger'; detachBtn.textContent = 'Detach branch';
    detachBtn.onclick = () => { if (confirm('Detach the whole branch from ' + e.id + '? The branch gallery itself is untouched, only the link is removed.')) doAction({ type: 'branch-detach', trunkId: e.id }, 'Detached branch from ' + e.id); };
    actRow.appendChild(detachBtn);
  }
  actGrp.appendChild(actRow);
  controls.appendChild(actGrp);
  tcMain.appendChild(controls);

  head.appendChild(tcMain);
  card.appendChild(head);

  const branchSec = document.createElement('div'); branchSec.className = 'branch-sec';
  if (e.related.length) {
    const branchGallery = STATE.galleries.find((g) => g.id === e.related[0].series);
    const branchTitle = branchGallery && branchGallery.title && (branchGallery.title.fr || branchGallery.title.en);
    const secHead = document.createElement('div'); secHead.style.cssText = 'display:flex;align-items:center;gap:10px;margin-bottom:10px;';
    const h4 = document.createElement('h4'); h4.style.margin = '0';
    h4.textContent = 'Branch — ' + (branchTitle || e.related[0].series) + ' — ' + e.related.length + ' related photo(s)';
    secHead.appendChild(h4);
    if (branchGallery) {
      const addPhotoBtn = document.createElement('button'); addPhotoBtn.type = 'button'; addPhotoBtn.className = 'ghead-btn'; addPhotoBtn.textContent = 'Add photo…';
      addPhotoBtn.onclick = () => openAddPhotoToBranch(branchGallery, e.id);
      secHead.appendChild(addPhotoBtn);
      const renameBranchBtn = document.createElement('button'); renameBranchBtn.type = 'button'; renameBranchBtn.className = 'ghead-btn'; renameBranchBtn.textContent = 'Rename branch';
      renameBranchBtn.onclick = () => openGalleryTitleEditor(branchGallery);
      secHead.appendChild(renameBranchBtn);
      const deleteBranchBtn = document.createElement('button'); deleteBranchBtn.type = 'button'; deleteBranchBtn.className = 'ghead-btn'; deleteBranchBtn.textContent = 'Delete branch'; deleteBranchBtn.style.borderColor = '#633'; deleteBranchBtn.style.color = '#f99';
      deleteBranchBtn.onclick = () => openDeleteBranchConfirm(branchGallery);
      secHead.appendChild(deleteBranchBtn);
    }
    branchSec.appendChild(secHead);
    const grid = document.createElement('div'); grid.className = 'rel-grid';
    e.related.forEach((r, i) => {
      const rc = document.createElement('div'); rc.className = 'rel-card';
      rc.dataset.series = r.series; rc.dataset.file = r.file;
      makeDraggable(rc);
      rc.appendChild(thumbImg(r.series, r.file));
      const fnTag = document.createElement('span'); fnTag.className = 'rel-fn'; fnTag.textContent = i + '. ' + r.file;
      rc.appendChild(fnTag);
      const actions = document.createElement('div'); actions.className = 'rel-actions';
      actions.appendChild(titleBtn(r.series, r.file));
      const reorderGrp = document.createElement('span'); reorderGrp.className = 'reorder-grp';
      const rpos = document.createElement('input'); rpos.className = 'posnum'; rpos.placeholder = '#'; rpos.title = 'position to move this photo to (used by the Reorder button next to it)';
      const rbtn = document.createElement('button'); rbtn.textContent = 'Reorder'; rbtn.title = 'moves this photo to the position typed in the # box';
      rbtn.onclick = () => { if (rpos.value.trim() === '') { toast('type a position number in the # box first', true); return; } doAction({ type: 'branch-reorder-related', trunkId: e.id, branchSeries: r.series, file: r.file, position: Number(rpos.value) }, 'Reordered'); };
      reorderGrp.appendChild(rpos); reorderGrp.appendChild(rbtn);
      actions.appendChild(reorderGrp);
      const moveGrp2 = document.createElement('span'); moveGrp2.className = 'reorder-grp';
      const moveSel = document.createElement('select'); moveSel.title = 'move this photo to a different gallery';
      const moveOpt0 = document.createElement('option'); moveOpt0.value = ''; moveOpt0.textContent = 'Move to…';
      moveSel.appendChild(moveOpt0);
      galleryIds().forEach((id) => { if (id === r.series) return; const o = document.createElement('option'); o.value = id; o.textContent = id; moveSel.appendChild(o); });
      // Fires on selection itself (same pattern as the Galleries tab's own
      // move select) rather than needing a separate "Move" click — a
      // second click after picking a value can silently do nothing if it
      // lands between renders, same class of bug as the Reorder/Move
      // buttons elsewhere that DO need a second click.
      moveSel.onchange = () => {
        if (!moveSel.value) return;
        const to = moveSel.value;
        doAction({ type: 'place', from: r.series, to, file: r.file }, 'Moved ' + r.file + ' to ' + to);
      };
      moveGrp2.appendChild(moveSel);
      actions.appendChild(moveGrp2);
      const rm = document.createElement('button'); rm.className = 'danger'; rm.textContent = 'Remove';
      rm.title = 'unlinks this photo from ' + e.id + ' — the photo itself stays in ' + r.series + ', only the link is removed';
      rm.onclick = () => { if (confirm('Remove ' + r.file + ' from ' + e.id + '? The photo stays in ' + r.series + ", only the link here is removed — there's no undo button, you'd have to re-add it by hand.")) doAction({ type: 'branch-remove-related', trunkId: e.id, file: r.file }, 'Removed ' + r.file + ' from ' + e.id); };
      actions.appendChild(rm);
      rc.appendChild(actions);
      grid.appendChild(rc);
    });
    enableDragReorder(grid, '.rel-card', (newIndex, el) => doAction({ type: 'branch-reorder-related', trunkId: e.id, branchSeries: el.dataset.series, file: el.dataset.file, position: newIndex }, 'Reordered'));
    branchSec.appendChild(grid);
  } else {
    branchSec.innerHTML = '<h4>No branch yet</h4>';
    const attach = document.createElement('div');
    const branchSel = document.createElement('select'); branchSel.style.marginBottom = '8px';
    STATE.galleries.filter((g) => g.id.startsWith('branch-')).forEach((g) => { const o = document.createElement('option'); o.value = g.id; o.textContent = g.id; branchSel.appendChild(o); });
    const grid = document.createElement('div'); grid.className = 'pick-grid';
    function refillGrid() {
      grid.innerHTML = '';
      const g = STATE.galleries.find((x) => x.id === branchSel.value);
      (g ? g.images : []).filter((i) => !i.archived).forEach((i) => {
        const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'pick-thumb';
        btn.title = i.file;
        const img = document.createElement('img'); img.loading = 'lazy'; img.src = thumbUrl(g, i);
        btn.appendChild(img);
        const fnTag = document.createElement('span'); fnTag.className = 'pt-fn'; fnTag.textContent = i.file;
        btn.appendChild(fnTag);
        btn.onclick = () => doAction({ type: 'branch-add-related', trunkId: e.id, branchSeries: branchSel.value, file: i.file }, 'Attached ' + i.file + ' to ' + e.id);
        grid.appendChild(btn);
      });
      if (!grid.children.length) {
        grid.textContent = '(no un-archived photos in this branch yet) ';
        const addLink = document.createElement('button'); addLink.type = 'button'; addLink.className = 'ghead-btn'; addLink.textContent = 'Add photo…';
        addLink.onclick = () => { const g = STATE.galleries.find((x) => x.id === branchSel.value); if (g) openAddPhotoToBranch(g, e.id); };
        grid.appendChild(addLink);
      }
    }
    branchSel.onchange = refillGrid; refillGrid();
    const hint = document.createElement('div'); hint.className = 'hint'; hint.style.margin = '6px 0'; hint.textContent = 'Pick a branch, then click a photo to attach it as the first related photo.';
    attach.appendChild(branchSel); attach.appendChild(hint); attach.appendChild(grid);
    branchSec.appendChild(attach);
  }
  card.appendChild(branchSec);
  return card;
}

function renderTrunk() {
  const main = document.getElementById('panel-trunk');
  main.innerHTML = '';
  [['current', 'Oeuvre actuelle'], ['other', 'Autres travaux']].forEach(([key, label]) => {
    const sectionId = 'trunk-' + key;
    const wrap = document.createElement('div'); wrap.className = 'gallery' + (OPEN_SECTIONS.has(sectionId) ? '' : ' collapsed');
    const head = document.createElement('div'); head.className = 'g-head';
    head.innerHTML = '<b>' + label + '</b><span class="count">' + STATE.trunk[key].length + ' anchor(s)</span>';
    head.onclick = () => { wrap.classList.toggle('collapsed'); if (wrap.classList.contains('collapsed')) OPEN_SECTIONS.delete(sectionId); else OPEN_SECTIONS.add(sectionId); };
    wrap.appendChild(head);
    const rows = document.createElement('div'); rows.className = 'trunk-rows';
    STATE.trunk[key].forEach((e) => rows.appendChild(trunkRow(key, e)));
    enableDragReorder(rows, '.trunk-card', (newIndex, el) => doAction({ type: 'trunk-reorder', id: el.dataset.id, toSet: key, position: newIndex }, 'Reordered'));
    wrap.appendChild(rows);
    main.appendChild(wrap);
  });

  // create a brand-new trunk anchor from a photo already in GALLERY_DATA.trunk.images
  const form = document.createElement('form'); form.className = 'panel';
  form.innerHTML = '<h3>New trunk anchor</h3><div class="hint">Promotes a photo already in gallery-data.js\'s "trunk" series to a clickable anchor on one of the two pages. Upload into "trunk" first (Upload tab) if the photo isn\'t there yet. Only photos not already an anchor are offered, sorted by filename. Click one to pick it.</div>';
  const trunkGallery = STATE.galleries.find((g) => g.id === 'trunk');
  let pickedFile = null, pickedArchived = false;

  // Every photo already promoted to an anchor, on either page — excluded
  // below so this picker only ever shows genuinely unused trunk photos,
  // never a duplicate of an existing anchor.
  const usedFiles = new Set([...STATE.trunk.current, ...STATE.trunk.other].map((e) => e.file));
  const pool = (trunkGallery ? trunkGallery.images : []).filter((i) => !usedFiles.has(i.file));
  const available = pool.filter((i) => !i.archived).sort((a, b) => a.file.localeCompare(b.file));
  const archived = pool.filter((i) => i.archived).sort((a, b) => a.file.localeCompare(b.file));

  function pickGrid(label, items, isArchived) {
    if (!items.length) return null;
    const wrap = document.createElement('div');
    const lab = document.createElement('label'); lab.textContent = label + ' (' + items.length + ')'; wrap.appendChild(lab);
    const grid = document.createElement('div'); grid.className = 'pick-grid';
    items.forEach((i) => {
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'pick-thumb' + (isArchived ? ' archived' : ''); btn.title = i.file;
      const img = document.createElement('img'); img.loading = 'lazy'; img.src = thumbUrl(trunkGallery, i);
      btn.appendChild(img);
      const fnTag = document.createElement('span'); fnTag.className = 'pt-fn'; fnTag.textContent = i.file;
      btn.appendChild(fnTag);
      btn.onclick = () => {
        pickedFile = i.file; pickedArchived = isArchived;
        form.querySelectorAll('.pick-thumb').forEach((b) => b.classList.remove('sel'));
        btn.classList.add('sel');
      };
      grid.appendChild(btn);
    });
    wrap.appendChild(grid);
    return wrap;
  }
  const availableGrid = pickGrid('Available', available, false);
  if (availableGrid) form.appendChild(availableGrid);
  const archivedGrid = pickGrid('Archived — picking one restores it first', archived, true);
  if (archivedGrid) form.appendChild(archivedGrid);
  if (!available.length && !archived.length) { const p = document.createElement('p'); p.className = 'hint'; p.textContent = 'Every photo in "trunk" is already an anchor — upload a new one first.'; form.appendChild(p); }

  const setSel = document.createElement('select');
  [['current', 'Oeuvre actuelle'], ['other', 'Autres travaux']].forEach(([v, l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l; setSel.appendChild(o); });
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'submit'; btn.textContent = 'Create anchor';
  btn.onclick = async () => {
    if (!pickedFile) { toast('pick a photo first', true); return; }
    if (pickedArchived) await doAction({ type: 'unarchive', gallery: 'trunk', file: pickedFile }, null, true);
    doAction({ type: 'trunk-create-anchor', toSet: setSel.value, file: pickedFile }, 'Anchor created');
  };
  form.appendChild(setSel); form.appendChild(btn);
  main.appendChild(form);
}

// ---------------------------------------------------------------- Upload tab
function renderUpload() {
  const main = document.getElementById('panel-upload');
  main.innerHTML = '';
  const form = document.createElement('form'); form.className = 'panel';
  form.innerHTML = '<h3>Upload a new photo</h3>' +
    '<div class="hint">Runs .build/compress.js then .build/responsive.js (the real pipeline), writes into images/&lt;gallery&gt;/, and adds the data entry. .jpg/.jpeg only.</div>' +
    '<label>Source file</label><input type="file" id="up-file" accept="image/jpeg">' +
    '<label>Target gallery</label><select id="up-gallery"></select>' +
    '<label>Position (blank = append at end)</label><input type="number" id="up-pos" min="0">' +
    '<label>Alt text (required — EN / FR / ES)</label>' +
    '<div class="row3"><input id="up-alt-en" placeholder="EN"><input id="up-alt-fr" placeholder="FR"><input id="up-alt-es" placeholder="ES"></div>' +
    '<label>Title (optional, museum-label — EN / FR / ES)</label>' +
    '<div class="row3"><input id="up-title-en" placeholder="EN"><input id="up-title-fr" placeholder="FR"><input id="up-title-es" placeholder="ES"></div>' +
    '<label>Medium (optional)</label>' + mediumSelectHtml('up-medium') +
    '<label>Year (optional)</label><input type="number" id="up-year" min="1900" max="2100">' +
    '<label>Attach to a trunk anchor\'s "more like this" (only if target gallery is a branch-*)</label>' +
    '<select id="up-attach"><option value="">— don\'t attach —</option></select>' +
    '<button type="button" class="submit" id="up-submit">Upload</button>';
  main.appendChild(form);

  wireAutoTranslate({
    en: document.getElementById('up-title-en'),
    fr: document.getElementById('up-title-fr'),
    es: document.getElementById('up-title-es')
  });

  const gSel = document.getElementById('up-gallery');
  const { live, rest } = liveGalleryTiers();
  const liveGrp = document.createElement('optgroup'); liveGrp.label = 'Live — trunk, attached branches, in-use galleries';
  live.forEach((id) => { const o = document.createElement('option'); o.value = id; o.textContent = id; liveGrp.appendChild(o); });
  gSel.appendChild(liveGrp);
  if (rest.length) {
    const restGrp = document.createElement('optgroup'); restGrp.label = 'Archived / not currently shown';
    rest.forEach((id) => { const o = document.createElement('option'); o.value = id; o.textContent = id; restGrp.appendChild(o); });
    gSel.appendChild(restGrp);
  }
  const attachSel = document.getElementById('up-attach');
  function refillAttach() {
    attachSel.innerHTML = '<option value="">— don\'t attach —</option>';
    if (!gSel.value.startsWith('branch-')) { attachSel.disabled = true; return; }
    attachSel.disabled = false;
    [...STATE.trunk.current, ...STATE.trunk.other].forEach((e) => { const o = document.createElement('option'); o.value = e.id; o.textContent = e.id; attachSel.appendChild(o); });
  }
  gSel.onchange = refillAttach; refillAttach();

  document.getElementById('up-submit').onclick = async () => {
    const fileInput = document.getElementById('up-file');
    const f = fileInput.files[0];
    if (!f) { toast('pick a file first', true); return; }
    const altEn = document.getElementById('up-alt-en').value.trim();
    const altFr = document.getElementById('up-alt-fr').value.trim();
    const altEs = document.getElementById('up-alt-es').value.trim();
    if (!altEn || !altFr || !altEs) { toast('alt text (EN/FR/ES) is required', true); return; }
    const reader = new FileReader();
    reader.onload = async () => {
      const dataBase64 = reader.result.split(',')[1];
      const titleEn = document.getElementById('up-title-en').value.trim();
      const mediumKey = document.getElementById('up-medium').value;
      const posVal = document.getElementById('up-pos').value;
      const yearVal = document.getElementById('up-year').value;
      const action = {
        type: 'upload',
        gallery: gSel.value,
        filename: f.name,
        dataBase64,
        position: posVal === '' ? undefined : Number(posVal),
        alt: { en: altEn, fr: altFr, es: altEs },
        title: titleEn ? { en: titleEn, fr: document.getElementById('up-title-fr').value.trim() || titleEn, es: document.getElementById('up-title-es').value.trim() || titleEn } : null,
        medium: mediumKey ? MEDIUM_LOOKUP[mediumKey] : null,
        year: yearVal ? Number(yearVal) : null,
        attachToTrunkId: attachSel.value || undefined
      };
      try {
        await doAction(action, 'Uploaded');
        fileInput.value = '';
      } catch (e) { /* toast already shown */ }
    };
    reader.readAsDataURL(f);
  };
}

// ---------------------------------------------------------------- New branch tab
function renderNewBranch() {
  const main = document.getElementById('panel-newbranch');
  main.innerHTML = '';
  const form = document.createElement('form'); form.className = 'panel';
  form.innerHTML = '<h3>Create a new branch gallery</h3>' +
    '<div class="hint">Creates an empty "branch-*" entry in gallery-data.js. Upload photos into it afterward (Upload tab), then attach it to a trunk anchor (Trunk tab) if you want it to show as "more like this".</div>' +
    '<label>Id (lowercase, hyphens — e.g. "branch-night-market")</label><input id="nb-id" placeholder="branch-">' +
    '<label>Title — EN / FR / ES</label>' +
    '<div class="row3"><input id="nb-title-en" placeholder="EN"><input id="nb-title-fr" placeholder="FR"><input id="nb-title-es" placeholder="ES"></div>' +
    '<button type="button" class="submit" id="nb-submit">Create branch</button>';
  main.appendChild(form);
  document.getElementById('nb-submit').onclick = () => {
    const id = document.getElementById('nb-id').value.trim();
    const en = document.getElementById('nb-title-en').value.trim();
    if (!id || !en) { toast('id and at least an EN title are required', true); return; }
    const title = { en, fr: document.getElementById('nb-title-fr').value.trim() || en, es: document.getElementById('nb-title-es').value.trim() || en };
    doAction({ type: 'create-gallery', id, folder: 'images/' + id + '/', title }, 'Created ' + id).then(() => {
      document.getElementById('nb-id').value = '';
    }).catch(() => {});
  };
}

// ---------------------------------------------------------------- After Dark (18+) tab
// Same Galleries-tab UI (header + rename + card grid), scoped to every
// gallery actually behind the site's 18+ gate — js/art-gallery.js's own
// guard is the source of truth for that set (id==='nude' ||
// id==='boudoir' || id==='boudoir-red'), not a guess. A dedicated tab so
// all of the gated content — including boudoir's flagged exceptions —
// is in one place instead of hunting through all 26 galleries.
const AFTER_DARK_GALLERIES = ['nude', 'boudoir', 'boudoir-red'];
function renderAfterDark() {
  const main = document.getElementById('panel-afterdark');
  main.innerHTML = '';
  const note = document.createElement('p'); note.className = 'hint';
  note.textContent = 'Every gallery behind the site\'s 18+ gate (js/art-gallery.js) — nude, boudoir ("Dark Desire"), boudoir-red ("Boudoir"). Same Archive/Move/Rename/Edit-label controls as the Galleries tab, just scoped to these three.';
  main.appendChild(note);

  AFTER_DARK_GALLERIES.forEach((id) => {
    const g = STATE.galleries.find((x) => x.id === id);
    if (!g) return;
    const wrap = document.createElement('div'); wrap.className = 'gallery';
    const head = document.createElement('div'); head.className = 'g-head';
    const archivedCount = g.images.filter((i) => i.archived).length;
    head.innerHTML = '<b>' + g.id + '</b><span class="count">' + g.images.length + ' image(s)' + (archivedCount ? ', <span class="archcount">' + archivedCount + ' archived</span>' : '') + '</span>';
    head.onclick = () => wrap.classList.toggle('collapsed');
    const renameBtn = document.createElement('button'); renameBtn.type = 'button'; renameBtn.className = 'ghead-btn'; renameBtn.textContent = 'Rename';
    renameBtn.style.marginLeft = 'auto';
    renameBtn.onclick = (ev) => { ev.stopPropagation(); openGalleryTitleEditor(g); };
    head.appendChild(renameBtn);
    wrap.appendChild(head);
    const grid = document.createElement('div'); grid.className = 'grid';
    g.images.forEach((im) => grid.appendChild(card(g, im)));
    wrap.appendChild(grid);
    main.appendChild(wrap);
  });
}

function renderAll() {
  renderGalleries();
  renderTrunk();
  renderUpload();
  renderNewBranch();
  renderAfterDark();
}

document.querySelectorAll('nav.tabs button').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('nav.tabs button').forEach((b) => b.classList.remove('on'));
    document.querySelectorAll('section.tabpanel').forEach((p) => p.classList.remove('on'));
    btn.classList.add('on');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('on');
  };
});

(async function init() {
  try {
    STATE = await api('/api/state');
    document.getElementById('main').innerHTML =
      '<section class="tabpanel on" id="panel-galleries"></section>' +
      '<section class="tabpanel" id="panel-trunk"></section>' +
      '<section class="tabpanel" id="panel-upload"></section>' +
      '<section class="tabpanel" id="panel-newbranch"></section>' +
      '<section class="tabpanel" id="panel-afterdark"></section>';
    renderAll();
    refreshPublishStatus();
  } catch (e) {
    document.getElementById('main').textContent = 'Failed to load: ' + e.message;
  }
})();
</script>
